<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>88ACADEMY · המסלול שלי</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Black+Ops+One&family=Heebo:wght@400;700;900&family=Secular+One&family=Suez+One&family=Varela+Round&family=Karantina:wght@700&family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800&family=Russo+One&family=Rubik:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&family=Unbounded:wght@700;900&display=swap">
<style>
/* Game-skinned student app. Two looks the admin picks per group: regular (arcade) and military. Both are deliberately dark, so no light/dark switching. */
:root {
  color-scheme: dark;
  --night: #0E1F1C;
  --night2: #13302A;
  --panel: #1B3D36;
  --mint: #76DEB8;
  --mint-d: #3FB58C;
  --mint-dd: #23805F;
  --pink: #FF5C8A;
  --pink-d: #C7436A;
  --pink-dd: #8E2346;
  --gold: #FFD15C;
  --gold-d: #E0A021;
  --gold-dd: #9A6A0A;
  --sky: #5BC8FF;
  --sky-d: #2C8FD0;
  --purple: #A774FF;
  --purple-d: #6B3FC9;
  --ink: #0B1513;
  --white: #FFFFFF;
  --dim: #9DBDB3;
  --lock: #3A5650;
  --lock-d: #263B37;
  --f: 'Rubik', system-ui, sans-serif;
  --n: 'Unbounded', 'Rubik', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #08130F; color: var(--white); font-family: var(--f); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.stage { min-height: 100%; display: grid; place-items: center; }
.app { position: relative; width: 100%; max-width: 440px; height: 100vh; height: 100dvh; overflow: hidden; background:
  radial-gradient(120% 60% at 80% 0%, rgba(118,222,184,.22), transparent 60%),
  radial-gradient(90% 50% at 0% 100%, rgba(255,92,138,.16), transparent 60%),
  linear-gradient(180deg, var(--night2), var(--night)); display: flex; flex-direction: column; }
@media (min-width: 520px) and (max-width: 899px) { .app { height: min(900px, calc(100dvh - 40px)); border-radius: 36px; box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 0 8px #050c0a; } }

/* top resource bar */
.topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }
.avatar { position: relative; width: 50px; height: 50px; border-radius: 16px; background: linear-gradient(160deg, var(--pink), var(--pink-d)); box-shadow: 0 4px 0 var(--pink-dd); display: grid; place-items: center; font-weight: 900; font-size: 22px; flex: none; }
.avatar .lv { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--ink); font-family: var(--n); font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 8px; box-shadow: 0 2px 0 var(--gold-dd); white-space: nowrap; }
.who { min-width: 0; flex: 1; }
.who b { display: block; font-size: 16px; font-weight: 800; line-height: 1.1; }
.xp { margin-top: 5px; height: 12px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; position: relative; }
.xp i { display: block; height: 100%; width: 60%; background: linear-gradient(90deg, var(--mint), #B6FFE3); border-radius: 99px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); transition: width .9s cubic-bezier(.2,.9,.2,1); }
.xp span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--n); font-size: 8px; font-weight: 900; color: var(--ink); }
.res { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px 0 4px; border-radius: 99px; background: rgba(0,0,0,.35); font-family: var(--n); font-weight: 900; font-size: 13px; flex: none; }
.res .ic { width: 26px; height: 26px; display: grid; place-items: center; }
.coinic { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #FFF2B3, var(--gold) 45%, var(--gold-d)); box-shadow: inset 0 -2px 0 var(--gold-dd); display: grid; place-items: center; font-size: 8px; color: var(--gold-dd); font-weight: 900; }
.flame { font-size: 18px; filter: drop-shadow(0 0 6px rgba(255,140,60,.7)); }

/* views */
.views { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 4px max(14px, env(safe-area-inset-right, 0px)) 120px max(14px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.h1 { font-weight: 900; font-size: 30px; line-height: 1; margin: 10px 0 4px; text-wrap: balance; }
.sub { color: var(--dim); font-size: 14px; margin: 0 0 14px; }

/* 3D chunky button */
.btn3 { border: 0; cursor: pointer; border-radius: 18px; font-weight: 900; font-size: 18px; height: 58px; padding: 0 22px; color: var(--ink); background: var(--mint); box-shadow: 0 6px 0 var(--mint-dd), 0 10px 20px rgba(0,0,0,.3); transition: transform .08s, box-shadow .08s; }
.btn3:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--mint-dd); }
.btn3.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-dd), 0 10px 20px rgba(0,0,0,.3); }
.btn3.pink:active { box-shadow: 0 1px 0 var(--pink-dd); }
.btn3.gold { background: var(--gold); box-shadow: 0 6px 0 var(--gold-dd), 0 10px 20px rgba(0,0,0,.3); }
.btn3.gold:active { box-shadow: 0 1px 0 var(--gold-dd); }
.btn3.ghost { background: rgba(255,255,255,.1); color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.btn3:disabled { background: var(--lock); color: var(--dim); box-shadow: 0 6px 0 var(--lock-d); cursor: default; }
.btn3.full { width: 100%; }

/* ===== MAP ===== */
.world { position: relative; border-radius: 26px; padding: 16px 16px 18px; margin: 18px 0 6px; overflow: hidden; }
.world h3 { margin: 0; font-weight: 900; font-size: 24px; line-height: 1; }
.world p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
.world .tagw { position: absolute; top: 14px; left: 14px; font-family: var(--n); font-size: 10px; font-weight: 900; background: rgba(0,0,0,.25); padding: 4px 8px; border-radius: 8px; }
.world .deco { position: absolute; left: -10px; bottom: -18px; font-size: 70px; opacity: .25; transform: rotate(-12deg); pointer-events: none; }
.w1 { background: linear-gradient(135deg, var(--mint), var(--mint-d)); color: var(--ink); box-shadow: 0 6px 0 var(--mint-dd); }
.w2 { background: linear-gradient(135deg, var(--sky), var(--sky-d)); color: #fff; box-shadow: 0 6px 0 #1C5F8C; }
.w3 { background: linear-gradient(135deg, var(--purple), var(--purple-d)); color: #fff; box-shadow: 0 6px 0 #45238A; }
.wb { background: linear-gradient(135deg, #2A2F2D, #0B0D0C); color: #fff; box-shadow: 0 6px 0 #000; border: 2px solid var(--pink); }
.locked.world { filter: saturate(.25) brightness(.7); }
.trail { position: relative; height: var(--h); }
.trail svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; transform: translate(-50%, -50%); width: 78px; height: 78px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font-size: 30px; padding: 0; transition: transform .1s; }
.node:active { transform: translate(-50%, -46%); }
.node .face { width: 78px; height: 72px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.node.done .face { background: linear-gradient(180deg, #FFE48A, var(--gold)); box-shadow: 0 7px 0 var(--gold-dd), inset 0 -4px 0 rgba(0,0,0,.08); }
.node.now .face { background: linear-gradient(180deg, #FF8FB0, var(--pink)); box-shadow: 0 7px 0 var(--pink-dd); }
.node.now::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 4px solid rgba(255,92,138,.5); animation: ping 1.6s ease-out infinite; }
.node.wait .face { background: linear-gradient(180deg, #A9EEFF, var(--sky)); box-shadow: 0 7px 0 #1C5F8C; }
.node.lock .face { background: var(--lock); box-shadow: 0 7px 0 var(--lock-d); color: #6E8C84; }
.node.chest .face { background: transparent; box-shadow: none; font-size: 52px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
.node.chest.ready .face { animation: wobble 1.4s ease-in-out infinite; }
.node.boss { width: 110px; height: 110px; }
.node.boss .face { width: 110px; height: 100px; background: radial-gradient(circle at 50% 35%, #3A3F3D, #0B0D0C); box-shadow: 0 8px 0 #000, 0 0 0 4px var(--pink), 0 0 30px rgba(255,92,138,.5); font-size: 44px; }
.node .crown { position: absolute; top: -10px; right: -6px; background: var(--ink); color: var(--gold); font-family: var(--n); font-size: 10px; font-weight: 900; border-radius: 10px; padding: 3px 6px; border: 2px solid var(--gold); }
.node .nl { position: absolute; top: 100%; margin-top: 12px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.45); padding: 3px 9px; border-radius: 99px; color: #fff; }
.node.lock .nl { color: #7E9A92; }
@keyframes ping { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-9deg); } 20% { transform: rotate(8deg); } 30% { transform: rotate(-5deg); } 40% { transform: rotate(0); } }
.pilot { position: absolute; width: 70px; height: 70px; transform: translate(-50%, -100%); pointer-events: none; animation: hover 2s ease-in-out infinite; z-index: 3; }
.pilot .bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #fff; color: var(--ink); font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 14px; white-space: nowrap; margin-bottom: 4px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.pilot .bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; }
@keyframes hover { 0%, 100% { margin-top: -6px; } 50% { margin-top: 4px; } }
.prop { transform-box: fill-box; transform-origin: center; animation: spin .18s linear infinite; }
.prop.r { animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== bottom sheet ===== */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: linear-gradient(180deg, #1F4A41, #15332D); border-radius: 30px 30px 0 0; padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-left, 0px)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.25,1); box-shadow: 0 -10px 40px rgba(0,0,0,.4); max-height: 88%; overflow-y: auto; }
.sheet.on { transform: none; }
.grab { width: 48px; height: 6px; border-radius: 9px; background: rgba(255,255,255,.25); margin: 0 auto 12px; }
.sheet .kick { font-family: var(--n); font-size: 10px; font-weight: 900; letter-spacing: .14em; color: var(--mint); }
.sheet h2 { margin: 4px 0 0; font-size: 32px; font-weight: 900; line-height: 1; text-wrap: balance; }
.sheet .desc { color: var(--dim); font-size: 14px; margin: 8px 0 0; line-height: 1.5; }
.steps { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: rgba(0,0,0,.22); border: 2px solid transparent; }
.step.on { border-color: var(--pink); background: rgba(255,92,138,.1); }
.step.ok { border-color: var(--mint-d); }
.step .si { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex: none; background: rgba(255,255,255,.08); }
.step.ok .si { background: var(--mint); color: var(--ink); font-weight: 900; }
.step b { display: block; font-size: 15px; }
.step small { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
.step .rw { margin-inline-start: auto; font-family: var(--n); font-weight: 900; font-size: 12px; color: var(--gold); white-space: nowrap; }
.vid { position: relative; height: 150px; border-radius: 18px; background: linear-gradient(135deg, #0B1513, #1F3C35); display: grid; place-items: center; overflow: hidden; margin-top: 12px; }
.vid .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.15); }
.vid .bar i { display: block; height: 100%; width: 0; background: var(--pink); }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

/* ===== quests ===== */
.streak { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 24px; background: linear-gradient(135deg, #FF9A3C, #FF5C8A); box-shadow: 0 6px 0 #9C2E45; }
.streak .big { font-size: 54px; line-height: 1; filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
.streak b { font-size: 26px; font-weight: 900; display: block; line-height: 1; }
.streak small { font-size: 13px; opacity: .9; }
.days { display: flex; gap: 6px; margin-top: 8px; }
.days span { width: 28px; height: 28px; border-radius: 9px; background: rgba(0,0,0,.2); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.days span.y { background: #fff; color: #E0533C; }
.quest { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 22px; background: var(--panel); box-shadow: 0 5px 0 rgba(0,0,0,.35); margin-top: 12px; }
.quest .qi { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; flex: none; }
.quest .qb { flex: 1; min-width: 0; }
.quest b { font-size: 15px; display: block; }
.qbar { margin-top: 7px; height: 14px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; position: relative; }
.qbar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.qbar span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--n); font-size: 9px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.quest .claim { flex: none; height: 44px; font-size: 14px; padding: 0 14px; border-radius: 14px; }
.sect { font-weight: 900; font-size: 18px; margin: 24px 0 2px; display: flex; justify-content: space-between; align-items: baseline; }
.sect small { font-family: var(--n); font-size: 11px; color: var(--gold); }
.weekchest { margin-top: 12px; padding: 16px; border-radius: 22px; background: linear-gradient(135deg, var(--purple), var(--purple-d)); box-shadow: 0 6px 0 #45238A; display: flex; gap: 12px; align-items: center; }

/* ===== league ===== */
.leaguehead { text-align: center; padding: 10px 0 0; }
.shield { width: 96px; height: 110px; margin: 0 auto; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
.leaguehead b { display: block; font-size: 28px; font-weight: 900; margin-top: 8px; }
.leaguehead small { color: var(--dim); font-size: 13px; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); align-items: end; gap: 8px; margin: 20px 0 6px; }
.pod { text-align: center; }
.pod .pa { width: 58px; height: 58px; margin: 0 auto 6px; border-radius: 18px; display: grid; place-items: center; font-weight: 900; font-size: 22px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.pod .pn { font-size: 13px; font-weight: 800; }
.pod .pb { margin-top: 6px; border-radius: 16px 16px 6px 6px; display: grid; place-items: center; font-family: var(--n); font-weight: 900; font-size: 26px; color: var(--ink); }
.lrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; margin-top: 6px; background: rgba(255,255,255,.05); }
.lrow.me { background: rgba(255,92,138,.18); border: 2px solid var(--pink); }
.lrow .pos { width: 26px; font-family: var(--n); font-weight: 900; font-size: 13px; color: var(--dim); text-align: center; }
.lrow .la { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; }
.lrow .ln { flex: 1; font-weight: 700; font-size: 15px; min-width: 0; }
.lrow .lx { font-family: var(--n); font-weight: 900; font-size: 13px; }
.zone { text-align: center; font-size: 12px; font-weight: 800; color: var(--mint); margin: 12px 0 4px; letter-spacing: .04em; }
.zone.down { color: var(--pink); }
.timer { display: inline-flex; gap: 6px; align-items: center; background: rgba(0,0,0,.3); border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 700; margin-top: 8px; }

/* ===== league prizes: what the admin approved for the group, redeemed with coins ===== */
#v-league { container-type: inline-size; }
.lg { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
.lg > * { min-width: 0; }
.prizes { margin-top: 26px; }
.przhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.przhead h2 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.15; text-wrap: balance; }
.przhead small { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--dim); }
.wallet { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 99px; background: rgba(0,0,0,.3); font-family: var(--n); font-weight: 900; font-size: 14px; white-space: nowrap; }
.wallet small { display: inline; margin: 0; font-family: var(--f); font-size: 11px; font-weight: 700; color: var(--dim); }
.wallet .coinic, .prz .coinic { width: 18px; height: 18px; font-size: 6px; flex: none; }
.przlist { display: grid; gap: 14px; margin-top: 14px; }
.prz { position: relative; display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px 12px; align-items: start; padding: 12px; border-radius: 22px; background: var(--panel); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.prz .pimg, .pzrow .pimg { width: 68px; height: 68px; border-radius: 16px; overflow: hidden; display: grid; place-items: center; font-size: 34px; line-height: 1; background: var(--pink); color: #fff; }
.prz .pimg.ic-food, .pzrow .pimg.ic-food { background: var(--mint); }
.prz .pimg.ph, .pzrow .pimg.ph { background: rgba(0,0,0,.2); }
.prz .pimg img, .pzrow .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prz .pbody { min-width: 0; display: grid; gap: 3px; }
.prz .pt { font-size: 15px; font-weight: 800; line-height: 1.3; }
.prz .pd { font-size: 12px; color: var(--dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prz .pmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--dim); }
.prz .pcost { display: inline-flex; align-items: center; gap: 5px; font-family: var(--n); font-size: 14px; font-weight: 900; color: var(--gold); }
.prz .pgot { color: var(--mint); }
.prz.out .pstock { color: var(--pink); }
.prz .ptag { padding: 2px 9px; border-radius: 99px; background: var(--sky); color: var(--ink); font-size: 11px; font-weight: 900; }
.prz .pact { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
.prz .pact .qbar { flex: 1 1 120px; margin: 0; height: 16px; }
.prz .pact .qbar span { font-size: 10px; }
.prz.can .qbar i { background: var(--mint); }
.prz .pgo, .prz .pbtns .btn3 { flex: none; height: 40px; padding: 0 16px; font-size: 14px; border-radius: 14px; box-shadow: 0 4px 0 var(--mint-dd); }
.prz .pgo.gold, .prz .pbtns .gold { box-shadow: 0 4px 0 var(--gold-dd); }
.prz .pgo:disabled { box-shadow: 0 4px 0 var(--lock-d); }
.prz .pbtns .ghost { box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.prz .pnote { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.45; }
.prz .pbtns { display: flex; gap: 8px; }
.prz .linkbtn { border: 0; background: none; padding: 6px 2px; color: inherit; font: inherit; font-size: 13px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.prz.pend { box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 0 0 2px var(--sky); }
.przempty { margin: 14px 0 0; padding: 16px; border-radius: 18px; background: rgba(0,0,0,.25); color: var(--dim); font-size: 14px; line-height: 1.5; }
@container (min-width: 880px) {
  .lg { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr) minmax(0, 1fr); column-gap: 28px; }
  .lg .prizes { margin-top: 0; }
  .lg #ladder > .zone:first-child { margin-top: 2px; }
}
@container (min-width: 600px) and (max-width: 879.98px) {
  .lg { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); column-gap: 28px; }
  .lg .prizes { grid-column: 1 / -1; }
  .lg .przlist { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
}
@container (max-width: 599.98px) {

@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }

/* ================= LIVE SITE: pieces the real data needs ================= */
.pname { font-weight: 900; font-size: 28px; margin-top: 4px; }
/* bell with the unread count */
.bellbtn { position: relative; }
.bellbtn .tcount { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; font-family: var(--f); font-size: 10px; }
/* a short line at the bottom of the screen for quiet confirmations */
.say { position: absolute; z-index: 70; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translate(-50%, 12px); max-width: min(92%, 520px); padding: 10px 16px; border-radius: 14px; background: rgba(8,12,11,.92); color: #fff; font-size: 14px; font-weight: 700; line-height: 1.45; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
.say.on { opacity: 1; transform: translate(-50%, 0); }
.say.err { background: #7F1D1D; }
.app.race .say { border-radius: 0; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%); }
/* the slide's small status line under the title */
.chipline { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.1); }
.chip.sky { background: var(--sky); color: var(--ink); }
.chip.mint { background: var(--mint); color: var(--ink); }
.chip.pink { background: var(--pink); color: #fff; }
.chip.gold { background: var(--gold); color: var(--ink); }
.app.race .chip { border-radius: 0; }
.app.mil .chip { border-radius: 4px; }
.passbox { padding: 10px 14px; border-radius: 16px; background: rgba(0,0,0,.22); font-size: 13px; line-height: 1.5; }
.passbox b { display: block; font-size: 12px; letter-spacing: .04em; color: var(--mint); margin-bottom: 2px; }
.passbox .mapn { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 6px; background: rgba(255,255,255,.1); font-family: var(--n); font-size: 11px; letter-spacing: .06em; }
.app.race .passbox, .app.race .inote { border-radius: 0; }
/* upload: a link instead of a file, a note for the instructor, then send */
.upl-or { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.upl-or::before, .upl-or::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.18); }
.upl-link { display: flex; gap: 6px; }
.upl-link input, .upl-note { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.22); background: rgba(0,0,0,.25); color: inherit; font: inherit; font-size: 14px; }
.upl-note { display: block; width: 100%; box-sizing: border-box; height: 64px; padding: 8px 12px; resize: vertical; text-align: right; }
.upl-link input:focus, .upl-note:focus { outline: 2px solid var(--mint); outline-offset: 1px; }
.upl-link .btn3 { height: 40px; font-size: 14px; padding: 0 14px; border-radius: 12px; box-shadow: 0 4px 0 var(--mint-dd); }
.upl-ready { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px; background: rgba(0,0,0,.22); text-align: start; }
.upl-ready .upl-done { background: rgba(118,222,184,.14); color: var(--white); }
.upl-ready .row2 .btn3 { height: 48px; font-size: 16px; }
.skipv { border: 0; background: none; color: var(--dim); font: inherit; font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; align-self: center; }
.app.race .upl-link input, .app.race .upl-note, .app.race .upl-ready, .app.race .upl-link .btn3 { border-radius: 0; }
.app.mil .upl-link input, .app.mil .upl-note, .app.mil .upl-ready { border-radius: 6px; }
/* a real demo video inside the growing player */
.vplayer video, .vplayer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.vplayer .vtop { position: absolute; z-index: 2; top: 10px; inset-inline-start: 10px; display: flex; gap: 8px; opacity: 0; transition: opacity .3s .3s; }
.vplayer.open .vtop { opacity: 1; }
.vbtn { height: 36px; padding: 0 14px; border: 0; border-radius: 99px; background: rgba(0,0,0,.65); color: #fff; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }

.qbonus { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(0,0,0,.25); font-size: 14px; font-weight: 700; }

/* league: when nobody else is playing yet */
.lgempty { margin-top: 12px; padding: 14px 16px; border-radius: 18px; background: rgba(0,0,0,.25); color: var(--dim); font-size: 14px; line-height: 1.5; text-align: center; }
.app.race .lgempty { border-radius: 0; }
/* hangar: how coins are earned, account */
.guide { display: grid; gap: 6px; margin-top: 12px; }
.guide div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,.22); font-size: 14px; }
.guide b { font-family: var(--n); color: var(--gold); white-space: nowrap; }

.acct a, .acct button { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 0; border-radius: 14px; background: rgba(255,255,255,.1); color: inherit; font: inherit; font-size: 14px; font-weight: 800; text-decoration: none; cursor: pointer; }
.acct a:hover, .acct button:hover { background: rgba(255,255,255,.18); }
.app.race .guide div, .app.race .acct a, .app.race .acct button { border-radius: 0; }
.app.mil .guide div, .app.mil .acct a, .app.mil .acct button { border-radius: 6px; }
.skin.locked { cursor: default; opacity: .55; }
.skin.locked svg { filter: grayscale(1); }
/* notifications */
.nlist { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.nrow { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 10px 12px; border: 0; border-radius: 14px; background: rgba(255,255,255,.06); color: inherit; font: inherit; text-align: start; cursor: pointer; }
.nrow.unread { background: color-mix(in srgb, var(--mint) 16%, transparent); }

.nrow span { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; }
.nrow small { display: block; margin-top: 2px; font-size: 12px; color: var(--dim); }
.nempty { margin: 16px 0 0; color: var(--dim); font-size: 14px; }
.app.race .nrow { border-radius: 0; }
/* first visit */
.intro { display: grid; gap: 10px; margin: 16px 0; padding: 0; list-style: none; counter-reset: s; }
.intro li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5; }
.intro li::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--mint); color: var(--ink); font-family: var(--n); font-weight: 900; font-size: 13px; }
.intro b { display: block; }
.app.race .intro li::before { border-radius: 0; background: var(--green); color: #fff; }
/* the night scene's tower stands behind the text on a wide screen */
@media (min-width: 900px) { #app .scn-night .s-twr { display: none; } }
/* day mode for the new pieces */
#app.day .upl-link input, #app.day .upl-note { background: #fff; border-color: rgba(0,0,0,.18); }
#app.day .upl-or::before, #app.day .upl-or::after { background: rgba(0,0,0,.14); }
#app.day .upl-ready, #app.day .passbox, #app.day .qbonus, #app.day .lgempty, #app.day .guide div, #app.day .chip { background: rgba(0,0,0,.05); }
#app.day .chip.sky { background: var(--sky); } #app.day .chip.mint { background: var(--mint); } #app.day .chip.pink { background: var(--pink); } #app.day .chip.gold { background: var(--gold); }
#app.day .acct a, #app.day .acct button, #app.day .nrow { background: rgba(0,0,0,.06); }
#app.day .nrow.unread { background: color-mix(in srgb, var(--mint) 22%, var(--d-card)); }
#app.day:not(.race) .chal { box-shadow: 0 4px 0 rgba(0,0,0,.07), 0 2px 10px rgba(0,0,0,.06); }
#app.day:not(.race) .guide b { color: var(--gold-dd); }
#app.day .say { background: rgba(20,24,22,.92); }
#app.day.race .chal { box-shadow: inset -7px 0 0 var(--sR), inset 0 0 0 1px rgba(0,0,0,.1); }
/* the instructor's stars on a finished exercise: the missing ones dimmed */
.stars { white-space: nowrap; letter-spacing: .04em; }
.stars i.off { font-style: normal; opacity: .32; }

/* ================= THE PILOT'S DRONE: the 88ACADEMY logo with a spinning propeller in each ring, three finishes ================= */
.drdefs { position: absolute; width: 0; height: 0; overflow: hidden; }
.skn { display: block; width: 100%; height: 100%; }
.dr { display: block; width: 100%; height: 100%; overflow: visible; }
.dr .frame { stroke-width: 3; stroke-linejoin: round; paint-order: stroke; }
.dr .prop path { stroke-width: 1.1; stroke-linejoin: round; }
.dr .disc { stroke: none; opacity: .2; }
.dr .hub { stroke-width: 1.7; }
.dr .prop { transform-box: fill-box; transform-origin: center; animation: spin .2s linear infinite; }
.dr .prop.r { animation-direction: reverse; }
/* 1 · classic: the logo in black with a white edge, pink props in front and mint at the back */
.dr-1 .frame { fill: #15181A; stroke: #FFFFFF; }
.dr-1 .prop path { stroke: #15181A; }
.dr-1 .f path, .dr-1 .f .disc { fill: #FF5C8A; }
.dr-1 .b path, .dr-1 .b .disc { fill: #76DEB8; }
.dr-1 .hub { fill: #15181A; stroke: #FFFFFF; }
/* 2 · mint: a mint frame, white props in front and pink at the back */
.dr-2 .frame { fill: url(#drMint); stroke: #0B2A21; }
.dr-2 .prop path { stroke: #0B2A21; }
.dr-2 .f path, .dr-2 .f .disc { fill: #FFFFFF; }
.dr-2 .b path, .dr-2 .b .disc { fill: #FF5C8A; }
.dr-2 .hub { fill: #0B2A21; stroke: #B9F8E0; }
/* 3 · gold: a gold frame with a glint, pink props in front and white at the back */
.dr-3 .frame { fill: url(#drGold); stroke: #3B2604; }
.dr-3 .prop path { stroke: #3B2604; }
.dr-3 .f path, .dr-3 .f .disc { fill: #FF5C8A; }
.dr-3 .b path, .dr-3 .b .disc { fill: #FFF6DA; }
.dr-3 .hub { fill: #3B2604; stroke: #FFD15C; }
.dr .glint { fill: url(#drGlint); transform: translateX(-20px) skewX(-18deg); animation: drglint 4.2s ease-in-out infinite; }
@keyframes drglint { 0%, 30% { transform: translateX(-20px) skewX(-18deg); } 75%, 100% { transform: translateX(150px) skewX(-18deg); } }
/* where it flies: the hangar (big, hovering), the skin cards, the side rail of the exercises and the full path map */
.rail .me .skn { width: 44px; height: 44px; margin: -2px; }
.pilot .skn { position: absolute; inset: 0; }
.pilot .dr { filter: drop-shadow(0 6px 6px rgba(0,0,0,.42)); }
#bigDrone .dr { filter: drop-shadow(0 12px 14px rgba(0,0,0,.35)); }
#bigDrone .dr-2 { filter: drop-shadow(0 12px 14px rgba(0,0,0,.35)) drop-shadow(0 0 16px rgba(118,222,184,.38)); }
#bigDrone .dr-3 { filter: drop-shadow(0 12px 14px rgba(0,0,0,.35)) drop-shadow(0 0 18px rgba(255,209,92,.5)); }
.skin .skn { width: 64px; height: 64px; margin: 0 auto; }
/* a locked drone is switched off: grey, props still */
.skin.locked .dr { filter: grayscale(1) brightness(.8); }
.skin.locked .dr .prop { animation: none; }
.skin.locked .dr .disc { opacity: 0; }
.skin.locked .dr .glint { display: none; }
#app.day .skin.locked .dr { filter: grayscale(1) brightness(.95); opacity: .75; }
/* the race look's pilot card stays green in day mode, so its text stays white */
#app.day.race .pilotcard .pname, #app.day.race .pilotcard .stats b { color: #FFFFFF; }
#app.day.race .pilotcard .stats small { color: rgba(255,255,255,.85); }

/* ================= THE WAY OUT: right under the hangar in the side menu, at the end of the bar on a phone ================= */
.tabs { grid-template-columns: repeat(4, minmax(0, 1fr)) auto; }
.app.noearn .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)) auto; }
.app .tab.tab-out { min-width: 58px; padding: 0 10px; background: transparent; box-shadow: none; color: var(--dim); clip-path: none; }
.app .tab.tab-out .ti { font-size: 22px; filter: none; transform: none; }
.app .tab.tab-out:hover { background: rgba(255,255,255,.07); color: var(--white); }
.app.race .tab.tab-out { background: transparent; color: rgba(255,255,255,.78); box-shadow: none; }
.app.race .tab.tab-out .ti { color: inherit; }
#app.day .tab.tab-out { background: transparent; color: var(--d-dim); box-shadow: none; }
#app.day .tab.tab-out:hover { background: rgba(0,0,0,.05); color: var(--d-fg); }
#app.day.race .tab.tab-out { color: var(--d-dim); box-shadow: none; }
@media (min-width: 900px) {
  #app .tab.tab-out { height: 46px; margin-top: 2px; padding: 0 20px; font-size: 15px; }
  #app .tab.tab-out .ti { font-size: 22px; }
}
/* the lock on a locked drone stays a small icon in the text (an old rule sizes every picture in a skin card) */
.app .skin .price .lic, .app.race .skin .price .lic { width: 1em; height: 1em; background: none; }
@media (min-width: 900px) { #app.day .tabs, #app.day.race .tabs { background: none; } }
/* the race look's highlight color is white: the lock line on its white skin cards needs a dark one */
.app.race .skin .price { color: #5D646A; }

/* ================= STAGE PICTURES: the hangar's badges and the full path show each stage's own background ================= */
.art-img { position: absolute; inset: 0; background: center / cover no-repeat; }
.bart .scn, .nart .scn { inset: 0; }
.bart .scn, .bart .scn > i, .nart .scn, .nart .scn > i { filter: none !important; }

/* skill badges: the picture in the tile, the name on its own line(s) under it */
.badges { row-gap: 16px; align-items: start; }
.bdg { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.bdg > small { font-size: 11.5px; font-weight: 700; line-height: 1.3; color: var(--dim); text-align: center; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge .bart { position: absolute; inset: 4px; border-radius: 16px; overflow: hidden; background: #1B1F1E; }
.badge.no .bart { filter: grayscale(1) brightness(.75); }
.app.race .badge .bart { border-radius: 0; }
.app.mil .badge .bart { border-radius: 4px; }
.app.race .bdg > small { color: rgba(255,255,255,.88); }
#app.day .bdg > small { color: var(--d-dim); }
#app.day.race .bdg > small { color: var(--d-fg); }

/* the full path: the picture inside each station's ring; the ring's color still says done, open, waiting or locked */
#pathmap .nart { position: absolute; inset: 5px; border-radius: 50%; overflow: hidden; background: #1B1F1E; }
#pathmap .node.boss .nart { inset: 7px; }
#pathmap .node.lock .nart { filter: grayscale(1) brightness(.6); }
#pathmap .node.wait .nart { filter: saturate(.8); }
#pathmap .node.chest .face { width: 70px; height: 66px; border-radius: 50%; filter: none; background: linear-gradient(180deg, #FFE48A, var(--gold)); box-shadow: 0 7px 0 var(--gold-dd); }
#pathmap .node.chest.lock .face { background: var(--lock); box-shadow: 0 7px 0 var(--lock-d); }
.app.mil #pathmap .nart { border-radius: 12px; }
.app.mil #pathmap .node.chest .face { border-radius: 16px; }
.app.race #pathmap .nart { inset: 4px; }
.app.race #pathmap .node.chest .face { background: rgba(16,18,20,.82); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.45); }
.app.race #pathmap .node.chest.ready .face { background: var(--bar); box-shadow: inset 0 0 0 3px var(--sY), 0 0 24px rgba(240,212,106,.55); }
#app.day.race #pathmap .node.chest .face { background: #FFFFFF; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.12); }
#app.day.race #pathmap .node.chest.ready .face { box-shadow: inset 0 0 0 3px var(--sY), 0 0 24px rgba(240,212,106,.55); }

/* ================= THE FULL PATH: every station is a waypoint lens =================
   The stage's picture behind glass, an instrument bezel with a tick scale, a ring in the station's state colour
   and the waypoint's number on the bezel. Open: a radar sweep and a turning arc. Waiting: a slow arc, like the
   tower thinking. Locked: dashed, grey, hatched. Chests are diamond supply drops; the final exam is locked on by a
   reticle. Colours come from the theme (pink, gold, sky…), so a theme the admin designs recolours the path too. */
:is(#pathmap, #deck) .node.wp {
  --wp: var(--lock); --wp-hi: #FFFFFF; --wp-tick: rgba(255,255,255,.3); --wp-face: #0C1714; --wp-chip: var(--ink);
  width: 80px; height: 80px; background: none;
}
:is(#pathmap, #deck) .node.wp::before { display: none; }
:is(#pathmap, #deck) .node.wp.done { --wp: var(--done); --wp-tick: color-mix(in srgb, var(--done) 70%, transparent); }
:is(#pathmap, #deck) .node.wp.now { --wp: var(--pink); --wp-tick: rgba(255,255,255,.72); }
:is(#pathmap, #deck) .node.wp.wait { --wp: var(--sky); --wp-tick: color-mix(in srgb, var(--sky) 65%, transparent); }
:is(#pathmap, #deck) .node.wp.fix { --wp: var(--fixc); --wp-tick: color-mix(in srgb, var(--fixc) 70%, transparent); }
:is(#pathmap, #deck) .node.wp.lock { --wp: rgba(255,255,255,.24); --wp-tick: rgba(255,255,255,.14); --wp-chip: rgba(255,255,255,.75); }

:is(#pathmap, #deck) .node.wp .face { width: 80px; height: 80px; border-radius: 50%; background: none; box-shadow: none; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
:is(#pathmap, #deck) .node.wp .bez { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
:is(#pathmap, #deck, #badges) .bez .b-face { fill: var(--wp-face); }
:is(#pathmap, #deck, #badges) .bez use { stroke: var(--wp-tick); stroke-linecap: round; }
:is(#pathmap, #deck, #badges) .bez .b-ring { fill: none; stroke: var(--wp); stroke-width: 4.5; }
:is(#pathmap, #deck, #badges) .bez .b-arc { display: none; fill: none; stroke: var(--wp-hi); stroke-width: 4.5; stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
:is(#pathmap, #deck) .node.lock .bez .b-ring { stroke-dasharray: 5 4.2; stroke-width: 3; }

/* the lens: the stage picture, glass glare and a dark rim */
:is(#pathmap, #deck) .node.wp .nart { position: absolute; overflow: hidden; background: #1B1F1E; inset: 13px; z-index: 1; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
:is(#pathmap, #deck) .node.wp .nart .glass { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(140deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.1) 30%, transparent 46%), radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.38) 100%); }
:is(#pathmap, #deck) .node.wp.lock .nart { filter: grayscale(1) brightness(.6); }
:is(#pathmap, #deck) .node.wp.wait .nart { filter: saturate(.8); }
:is(#pathmap, #deck) .node.wp.lock .nart::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(0,0,0,.42) 0 3px, transparent 3px 7px); }

/* the waypoint's number, set into the bottom of the bezel */
:is(#pathmap, #deck) .node.wp .wpn { position: absolute; left: 50%; bottom: -7px; z-index: 2; transform: translateX(-50%); min-width: 28px; padding: 3px 7px 2px; border-radius: 99px;
  background: var(--wp); color: var(--wp-chip); font: 800 10px/1.1 var(--n); letter-spacing: .06em; text-align: center; white-space: nowrap; box-shadow: 0 0 0 2.5px var(--wp-face); }
:is(#pathmap, #deck) .node.wp.lock .wpn { background: #2A3633; }
:is(#pathmap, #deck) .node.wp .crown { z-index: 3; top: -9px; right: -12px; }
:is(#pathmap, #deck) .node.wp .nl { margin-top: 15px; }

/* open: a turning arc on the ring; where the pilot is, also a radar sweep over the picture and a soft halo */
:is(#pathmap, #deck) .node.wp.now .nart .sweep { position: absolute; inset: -1px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: conic-gradient(from 0deg, transparent 0 70%, color-mix(in srgb, var(--pink) 70%, transparent) 99%, rgba(255,255,255,.9) 100%); animation: spin 2.8s linear infinite; }
:is(#pathmap, #deck) .node.wp.now .bez .b-arc { display: block; stroke-dasharray: 9 16.1; animation: spin 5s linear infinite; }
:is(#pathmap, #deck) .node.wp.now.here .face::after, :is(#pathmap, #deck) .node.wp.fix .face::after, :is(#pathmap, #deck) .node.chest.ready .face::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2.5px solid var(--wp); pointer-events: none; animation: wpHalo 2s ease-out infinite; }
@keyframes wpHalo { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.28); opacity: 0; } }
/* waiting for the instructor: one bright arc going round slowly */
:is(#pathmap, #deck) .node.wp.wait .bez .b-arc { display: block; stroke-dasharray: 22 78; animation: spin 2.6s linear infinite; }

/* chests: a diamond supply drop with the level's picture */
:is(#pathmap, #deck) .node.wp.chest { --wp: var(--gold); width: 66px; height: 66px; }
:is(#pathmap, #deck) .node.wp.chest.lock { --wp: rgba(255,255,255,.26); }
:is(#pathmap, #deck) .node.wp.chest.opened { --wp: color-mix(in srgb, var(--gold) 60%, #7A8A84); }
:is(#pathmap, #deck) .node.wp.chest .face { width: 52px; height: 52px; border-radius: 12px; transform: rotate(45deg); background: var(--wp-face); box-shadow: inset 0 0 0 3.5px var(--wp), 0 9px 14px rgba(0,0,0,.4); filter: none; overflow: visible; }
:is(#pathmap, #deck) .node.wp.chest .nart { inset: 7px; border-radius: 6px; box-shadow: none; }
:is(#pathmap, #deck) .node.wp.chest .nart > :not(.glass) { transform: rotate(-45deg) scale(1.45); }
:is(#pathmap, #deck) .node.wp.chest.lock .nart { filter: grayscale(1) brightness(.6); }
:is(#pathmap, #deck) .node.wp.chest.ready .face { animation: wpDrop 1.8s ease-in-out infinite; box-shadow: inset 0 0 0 3.5px var(--wp), 0 0 22px color-mix(in srgb, var(--gold) 60%, transparent), 0 9px 14px rgba(0,0,0,.4); }
:is(#pathmap, #deck) .node.wp.chest.ready .face::after { border-radius: 16px; }
@keyframes wpDrop { 0%, 100% { transform: rotate(45deg) translate(0, 0); } 50% { transform: rotate(45deg) translate(-3px, -3px); } }
:is(#pathmap, #deck) .node.wp.chest .nl { margin-top: 13px; }

/* the final exam: a bigger lens, locked on by a reticle */
:is(#pathmap, #deck) .node.wp.boss { --wp: var(--pink); --wp-tick: color-mix(in srgb, var(--pink) 60%, transparent); width: 112px; height: 112px; }
:is(#pathmap, #deck) .node.wp.boss.done { --wp: var(--done); }
:is(#pathmap, #deck) .node.wp.boss.lock { --wp: color-mix(in srgb, var(--pink) 45%, #555); --wp-tick: rgba(255,255,255,.16); }
:is(#pathmap, #deck) .node.wp.boss .face { width: 112px; height: 112px; background: none; box-shadow: none; }
:is(#pathmap, #deck) .node.wp.boss .nart { inset: 18px; }
:is(#pathmap, #deck) .node.wp .ret { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--wp); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
:is(#pathmap, #deck) .node.wp .ret .ret-x { stroke: rgba(255,255,255,.85); stroke-width: 1.8; }
:is(#pathmap, #deck) .node.wp.boss:not(.lock) .ret { animation: wpLock 2.4s ease-in-out infinite; transform-origin: center; }
@keyframes wpLock { 0%, 100% { transform: scale(1); } 50% { transform: scale(.94); } }

/* ---------- race: thin white instrument lines, square italic chips, green for done ---------- */
.app.race :is(#pathmap, #deck) .node.wp { --wp-face: rgba(14,16,18,.92); }
.app.race :is(#pathmap, #deck) .node.wp.done { --wp: var(--done); --wp-tick: rgba(255,255,255,.6); }
.app.race :is(#pathmap, #deck) .node.wp.now { --wp-tick: rgba(255,255,255,.8); }
.app.race :is(#pathmap, #deck) .node.wp .face { box-shadow: none; }
.app.race :is(#pathmap, #deck) .bez .b-ring { stroke-width: 3.2; }
.app.race :is(#pathmap, #deck) .node.wp:not(.lock):not(.chest) .bez .b-face { stroke: rgba(255,255,255,.85); stroke-width: 1.2; }
.app.race :is(#pathmap, #deck) .node.wp .wpn { border-radius: 0; padding: 3px 9px 2px; font: italic 700 10.5px/1.1 var(--f); letter-spacing: .04em; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); box-shadow: none; }
.app.race :is(#pathmap, #deck) .node.wp.done .wpn { color: #FFFFFF; }
.app.race :is(#pathmap, #deck) .node.wp.now .wpn { color: #FFFFFF; }
.app.race :is(#pathmap, #deck) .node.wp.chest { --wp: var(--sY, #F0D46A); }
.app.race :is(#pathmap, #deck) .node.wp.chest .face { border-radius: 0; background: var(--wp-face); box-shadow: inset 0 0 0 3px var(--wp), 0 8px 18px rgba(0,0,0,.45); }
.app.race :is(#pathmap, #deck) .node.wp.chest.ready .face { box-shadow: inset 0 0 0 3px var(--wp), 0 0 22px color-mix(in srgb, var(--wp) 55%, transparent), 0 8px 18px rgba(0,0,0,.45); }
.app.race :is(#pathmap, #deck) .node.wp.chest .nart { border-radius: 0; }
.app.race :is(#pathmap, #deck) .node.wp.chest.ready .face::after { border-radius: 0; }

/* ---------- military: a square viewfinder with corner brackets and a crosshair instead of the round bezel ---------- */
.app.mil :is(#pathmap, #deck) .node.wp:not(.chest) .bez { display: none; }
.app.mil :is(#pathmap, #deck) .node.wp:not(.chest) .face { border-radius: 6px; background: var(--wp-face); box-shadow: inset 0 0 0 3px var(--wp), 0 6px 0 rgba(0,0,0,.35); }
.app.mil :is(#pathmap, #deck) .node.wp:not(.chest) .face::before { content: ""; position: absolute; inset: -7px; pointer-events: none; background:
  linear-gradient(var(--wp), var(--wp)) left top / 15px 3px no-repeat, linear-gradient(var(--wp), var(--wp)) left top / 3px 15px no-repeat,
  linear-gradient(var(--wp), var(--wp)) right top / 15px 3px no-repeat, linear-gradient(var(--wp), var(--wp)) right top / 3px 15px no-repeat,
  linear-gradient(var(--wp), var(--wp)) left bottom / 15px 3px no-repeat, linear-gradient(var(--wp), var(--wp)) left bottom / 3px 15px no-repeat,
  linear-gradient(var(--wp), var(--wp)) right bottom / 15px 3px no-repeat, linear-gradient(var(--wp), var(--wp)) right bottom / 3px 15px no-repeat; }
.app.mil :is(#pathmap, #deck) .node.wp:not(.chest) .nart { inset: 9px; border-radius: 2px; box-shadow: none; }
.app.mil :is(#pathmap, #deck) .node.wp .nart .glass { background:
  linear-gradient(rgba(232,226,200,.7), rgba(232,226,200,.7)) center top / 1.5px 26% no-repeat, linear-gradient(rgba(232,226,200,.7), rgba(232,226,200,.7)) center bottom / 1.5px 26% no-repeat,
  linear-gradient(rgba(232,226,200,.7), rgba(232,226,200,.7)) left center / 26% 1.5px no-repeat, linear-gradient(rgba(232,226,200,.7), rgba(232,226,200,.7)) right center / 26% 1.5px no-repeat,
  linear-gradient(180deg, rgba(255,255,255,.18), transparent 40%); }
.app.mil :is(#pathmap, #deck) .node.wp .nart .sweep { border-radius: 0; }
.app.mil :is(#pathmap, #deck) .node.wp.now.here .face::after, .app.mil :is(#pathmap, #deck) .node.wp.fix .face::after { border-radius: 10px; }
.app.mil :is(#pathmap, #deck) .node.wp.now.here .face::before { animation: wpLock 1.6s ease-in-out infinite; }
.app.mil :is(#pathmap, #deck) .node.wp .wpn { border-radius: 2px; font: 400 10px/1.1 var(--n); letter-spacing: .1em; }
.app.mil :is(#pathmap, #deck) .node.wp.lock .wpn { background: #2A2F22; }
.app.mil :is(#pathmap, #deck) .node.wp.boss .ret { display: none; }
.app.mil :is(#pathmap, #deck) .node.wp.boss .face { background: repeating-linear-gradient(-45deg, #1E2117 0 10px, #12150D 10px 20px); }
.app.mil :is(#pathmap, #deck) .node.wp.chest .face { border-radius: 4px; }
.app.mil :is(#pathmap, #deck) .node.wp.chest .nart { border-radius: 2px; }
.app.mil :is(#pathmap, #deck) .node.wp.chest.ready .face::after { border-radius: 6px; }

/* ---------- day: a white bezel with dark ticks ---------- */
#app.day :is(#pathmap, #deck) .node.wp { --wp-face: #FFFFFF; --wp-tick: rgba(0,0,0,.26); }
#app.day :is(#pathmap, #deck) .node.wp.done { --wp-tick: color-mix(in srgb, var(--done) 65%, #000); }
#app.day :is(#pathmap, #deck) .node.wp.now { --wp-tick: color-mix(in srgb, var(--pink) 75%, transparent); }
#app.day :is(#pathmap, #deck) .node.wp.lock { --wp: rgba(0,0,0,.2); --wp-tick: rgba(0,0,0,.12); --wp-chip: #FFFFFF; }
#app.day :is(#pathmap, #deck) .node.wp.lock .wpn { background: #9AA3A0; }
#app.day :is(#pathmap, #deck) .node.wp .face { filter: drop-shadow(0 6px 10px rgba(0,0,0,.16)); }
#app.day :is(#pathmap, #deck) .node.wp.chest .face { filter: none; box-shadow: inset 0 0 0 3.5px var(--wp), 0 6px 14px rgba(0,0,0,.14); }
#app.day :is(#pathmap, #deck) .node.wp.chest.lock { --wp: rgba(0,0,0,.2); }
#app.day.race :is(#pathmap, #deck) .node.wp:not(.lock):not(.chest) .bez .b-face { stroke: rgba(0,0,0,.18); }
#app.day.race :is(#pathmap, #deck) .node.wp.done { --wp-tick: color-mix(in srgb, var(--done) 70%, transparent); }
#app.day.race :is(#pathmap, #deck) .node.wp.chest .face { background: #FFFFFF; box-shadow: inset 0 0 0 3px var(--wp), 0 6px 14px rgba(0,0,0,.14); }
#app.day.race :is(#pathmap, #deck) .node.wp.chest.ready .face { box-shadow: inset 0 0 0 3px var(--wp), 0 0 22px color-mix(in srgb, var(--wp) 55%, transparent); }

/* ================= THE WAY ON: the next stage as a button at the bottom of each window =================
   A glass capsule with the next stage's picture in a small lens and its name. */
.slide .nexthint { pointer-events: none; }
.slide .nexthint .nextbtn { pointer-events: auto; }
.nextbtn { --nb: var(--mint); position: relative; display: inline-flex; align-items: center; gap: 10px; max-width: 100%; height: 50px; padding: 0 5px; padding-inline-end: 20px;
  border: 1.5px solid transparent; border-radius: 99px; cursor: pointer; animation: none; text-align: start; color: var(--white);
  background: linear-gradient(rgba(9,20,17,.8), rgba(9,20,17,.8)) padding-box, linear-gradient(120deg, var(--nb), color-mix(in srgb, var(--sky) 80%, transparent) 55%, color-mix(in srgb, var(--pink) 75%, transparent)) border-box;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 10px 24px rgba(0,0,0,.38); transition: transform .15s, box-shadow .15s; }
.nextbtn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,.45); }
.nextbtn:active { transform: translateY(1px); }
.nextbtn .nb-art { position: relative; flex: none; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: #1B1F1E; box-shadow: 0 0 0 2px var(--nb), 0 0 0 4px rgba(0,0,0,.35); }
.nextbtn .nb-art .scn { inset: 0; }
.nextbtn .nb-art .scn, .nextbtn .nb-art .scn > i { filter: none !important; }
.nextbtn.nb-lock .nb-art { filter: grayscale(1) brightness(.7); }
.nextbtn .nb-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.nextbtn .nb-txt small { font: 700 10.5px var(--f); letter-spacing: .02em; color: var(--nb); }
.nextbtn .nb-txt b { font: 800 14px var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nextbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
/* phone: beside the full-path button, as wide as the room it has */
@media (max-width: 899px) {
  .slide .nexthint { bottom: 89px; left: auto; right: max(14px, env(safe-area-inset-right, 0px)); width: calc(100% - 196px); justify-content: flex-start; }
  .nextbtn .nb-txt b { font-size: 13px; }
}
@media (max-width: 359px) { .nextbtn .nb-art { display: none; } }
/* desktop: centred under the window, a little larger */
@media (min-width: 900px) {
  #app .slide .nexthint { bottom: 14px; }
  #app .nextbtn { height: 54px; max-width: 380px; }
  #app .nextbtn .nb-art { width: 42px; height: 42px; }
}

/* race: a white chamfered tag with the green stripe, like the race look's other buttons */
.app.race .nextbtn { --nb: var(--green, #5A9A7E); border: 0; border-radius: 0; height: 50px; padding: 0 10px; padding-inline-end: 24px; color: var(--ink); background: var(--bar);
  clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); box-shadow: inset -6px 0 0 var(--nb); -webkit-backdrop-filter: none; backdrop-filter: none; }
.app.race .nextbtn .nb-art { border-radius: 0; box-shadow: 0 0 0 2px var(--ink); margin-inline-start: 8px; }
.app.race .nextbtn .nb-txt small { color: var(--nb); font-style: italic; letter-spacing: .08em; }
.app.race .nextbtn .nb-txt b { font-style: italic; font-weight: 800; }
/* military: an olive plate with a stencil caption */
.app.mil .nextbtn { --nb: var(--mint); border-radius: 6px; background: linear-gradient(#262D1C, #262D1C) padding-box, linear-gradient(90deg, var(--mint), var(--gold)) border-box; }
.app.mil .nextbtn .nb-art { border-radius: 4px; }
.app.mil .nextbtn .nb-txt small { font: 400 10px var(--n); letter-spacing: .12em; }
/* day */
#app.day .nextbtn { color: var(--d-fg); background: linear-gradient(var(--d-card), var(--d-card)) padding-box, linear-gradient(120deg, var(--nb), color-mix(in srgb, var(--sky) 80%, transparent) 55%, color-mix(in srgb, var(--pink) 75%, transparent)) border-box; box-shadow: 0 8px 20px rgba(0,0,0,.12); }
#app.day:not(.race) .nextbtn .nb-txt small { color: var(--mint-dd); }
#app.day.race .nextbtn { background: #FFFFFF; box-shadow: inset -6px 0 0 var(--nb), inset 0 0 0 1px rgba(0,0,0,.14); }

/* ================= NO ICONS: the game speaks in words, numbers and pictures =================
   No emoji or pictograms anywhere: the menu is words, the steps are numbered, the top bar says "התראות", "רצף" and
   "יום/לילה", a prize without a picture shows its first letter, and the overlays show the stage's picture, the pilot's
   drone or the 88 coin. The coin stays: it is the currency's mark. */

/* top bar */
.res .rlbl { font-family: var(--f); font-weight: 700; font-size: 12px; opacity: .82; }
.res.streakres { gap: 6px; padding: 0 12px; }
.modebtn { font: 700 13px var(--f); padding: 0 12px; }
.bellbtn { gap: 0; padding: 0 12px; }
/* the unread count sits after the word, inside the button (the race look's slanted buttons would cut a corner badge) */
.bellbtn .tcount { position: static; margin-inline-start: 7px; }
.app.race .res .rlbl { opacity: .9; }

/* a phone: the day/night switch moves to the hangar's account section, so the name keeps its room */
@media (max-width: 519px) {
  #modeBtn { display: none !important; }
  .topbar { gap: 6px; }
  .res { padding: 0 9px; }
  .res .rlbl { font-size: 11px; }
  .bellbtn { padding: 0 10px; }
}
@media (min-width: 520px) { .acct .modeacct { display: none; } }

/* the menu: words only, readable on any background */
.tab { gap: 0; height: 52px; font-size: 13px; }
.app:not(.race) .tab:not(.on):not(.tab-out) { color: color-mix(in srgb, var(--white) 86%, transparent); background: rgba(6,16,13,.42); }
#app.day:not(.race) .tab:not(.on):not(.tab-out) { color: var(--d-fg); background: var(--d-card); }
.app .tab.tab-out { color: color-mix(in srgb, var(--white) 72%, transparent); }
#app.day .tab.tab-out { color: var(--d-dim); }
.app.race .tab { height: 50px; font-size: 13px; }
.app .tab.tab-out { min-width: 0; padding: 0 12px; font-size: 13px; }
@media (min-width: 900px) {
  #app .tab { height: 52px; font-size: 16px; padding: 0 22px; }
  #app .tab.tab-out { height: 44px; padding: 0 22px; font-size: 15px; }
}

/* the exercise window: numbered steps, and the instructor's stars beside the stage's name */
.step .si { font: 900 17px/1 var(--n); }
.app.race .step .si { font-family: var(--f); font-style: italic; font-weight: 800; }
.slide h2 .tstars { display: inline-block; margin-inline-start: .3em; font-size: .5em; line-height: 1; vertical-align: .22em; color: var(--gold); font-style: normal; letter-spacing: .06em; text-shadow: 0 2px 10px rgba(0,0,0,.35); white-space: nowrap; }
.app.race .slide h2 .tstars { color: #FFD15C; }
#app.day .slide h2 .tstars { color: var(--gold-dd); text-shadow: none; }

/* a short screen: the window tightens up before anything needs scrolling */
@media (min-width: 900px) and (max-height: 760px) {
  #app .slide > .sbody { padding-top: 16px; padding-bottom: 74px; }
  #app .slide .sgrid { row-gap: 9px; }
  #app .slide h2 { font-size: 36px; }
  #app .slide .sgrid > .hero { height: 240px; }
  #app .slide .node.big { transform: scale(1.75); }
  #app .slide .node.big.boss { transform: scale(1.4); }
  #app .slide .sgrid > .desc { font-size: 15px; }
  #app .slide .step { padding: 9px 14px; }
  #app .slide .step .si { width: 36px; height: 36px; }
}
@media (min-width: 900px) and (max-height: 620px) {
  #app .slide h2 { font-size: 30px; }
  #app .slide .step small { display: none; }
  #app .slide .sgrid > .hero { height: 190px; }
  #app .slide .node.big { transform: scale(1.4); }
  #app .slide .node.big.boss { transform: scale(1.1); }
}

/* daily tasks: a coloured edge instead of an icon; the streak is a big number */
.app:not(.race) .quest[style*="--qc"] { box-shadow: inset -6px 0 0 var(--qc), 0 5px 0 rgba(0,0,0,.35); padding-inline-start: 18px; }
#app.day:not(.race) .quest[style*="--qc"] { box-shadow: inset -6px 0 0 var(--qc), 0 4px 0 rgba(0,0,0,.07), 0 2px 10px rgba(0,0,0,.06); }
.app.race .quest[style*="--qc"] { padding-inline-start: 20px; }
.qbar .qtx { font-style: normal; white-space: nowrap; }
.streak .big { min-width: 1.1em; font: 900 56px/1 var(--n); text-align: center; filter: none; text-shadow: 0 4px 0 rgba(0,0,0,.18); }
.app.race .streak .big { font-family: var(--f); font-style: italic; font-weight: 800; }

/* the league: the coin beside each score */
.leaguehead { padding-top: 6px; }
.leaguehead b { margin-top: 0; }
.lrow .lx { display: inline-flex; align-items: center; gap: 6px; }
.lrow .lx .coinic { width: 18px; height: 18px; font-size: 6px; flex: none; }

/* a prize without a picture: its first letter */
.prz .pimg.pl, .pzrow .pimg.pl { font: 900 30px/1 var(--f); }

/* overlays: the stage's picture in a lens, the chest as a diamond, the pilot's drone, the coin */
.rbig .rlens { position: relative; display: block; width: 150px; height: 150px; margin: 0 auto 6px; border-radius: 50%; overflow: hidden; background: #1B1F1E; box-shadow: 0 0 0 5px var(--gold), 0 0 0 10px rgba(0,0,0,.22), 0 18px 36px rgba(0,0,0,.45); }
.rbig .rlens.dim { box-shadow: 0 0 0 5px #F0A35B, 0 0 0 10px rgba(0,0,0,.22), 0 18px 36px rgba(0,0,0,.45); }
.rbig .rlens .scn, .rbig .rdia .scn { inset: 0; }
.rbig .rlens .scn, .rbig .rlens .scn > i, .rbig .rdia .scn, .rbig .rdia .scn > i { filter: none !important; }
.rbig .rlens .art-img, .rbig .rdia .art-img { position: absolute; inset: 0; }
.rbig .rdia { position: relative; display: block; width: 118px; height: 118px; margin: 26px auto 28px; border-radius: 20px; overflow: hidden; transform: rotate(45deg); background: #1B1F1E; box-shadow: inset 0 0 0 5px var(--gold), 0 0 34px rgba(255,209,92,.45), 0 16px 30px rgba(0,0,0,.4); }
.rbig .rdia > * { transform: rotate(-45deg) scale(1.45); }
.rbig .rdrone { display: block; width: 180px; height: 180px; margin: 0 auto; }
.rbig .rdrone .dr { filter: drop-shadow(0 14px 18px rgba(0,0,0,.4)); }
.rbig .rcoin { width: 128px; height: 128px; margin: 0 auto 6px; font-size: 40px; box-shadow: inset 0 -7px 0 var(--gold-dd), 0 18px 34px rgba(0,0,0,.4); }
.app.race .rbig .rcoin { box-shadow: 0 18px 34px rgba(0,0,0,.4); }
.app.race .rbig .rlens, .app.race .rbig .rdia { border-radius: 0; }
.app.mil .rbig .rlens { border-radius: 8px; }

/* ================= COLOUR ROLES: each follows the look until the theme sets its own (the game sets them on #app) ================= */
.app { --done: var(--c-done, var(--gold)); --done-ink: #0B1513; --fixc: var(--c-fix, #F0A35B); --coin: var(--gold); --coin-d: var(--gold-d); --coin-dd: var(--gold-dd); --coin-ink: var(--gold-dd); }
.app.race { --done: var(--c-done, var(--green)); --done-ink: #FFFFFF; --fixc: var(--c-fix, var(--sO)); }
.app.race.cdone .rail .dot.done, #app.day.race.cdone .rail .dot.done { background: var(--done); }
.app.ccoin .coinic, .app.race.ccoin .coinic, .app.race.ccoin .prz .coinic { background: radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--coin) 35%, #fff), var(--coin) 45%, var(--coin-d)); color: var(--coin-ink); box-shadow: inset 0 -2px 0 var(--coin-dd); }
.app.cxp .xp i { background: linear-gradient(90deg, var(--c-xp), color-mix(in srgb, var(--c-xp) 45%, #fff)) !important; }
.app.cxp .qbar i { background: var(--c-xp) !important; }
.app.cmenu .tab.on { background: linear-gradient(180deg, color-mix(in srgb, var(--c-menu) 80%, #fff), var(--c-menu)) !important; color: var(--menu-ink) !important; box-shadow: 0 4px 0 rgba(0,0,0,.3), inset 0 0 0 2px color-mix(in srgb, var(--c-menu) 55%, #fff) !important; }
.app.race.cmenu .tab.on { background: var(--c-menu) !important; box-shadow: none !important; }

/* ================= THE DESIGNED CHECK: a disc in the "done" colour, a shine on its top half and a bold tick ================= */
.ck { position: absolute; z-index: 4; top: -5px; left: -6px; width: 26px; height: 26px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); animation: ckPop .45s cubic-bezier(.2,1.6,.4,1) both; pointer-events: none; }
.ck svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ck circle { fill: var(--done); stroke: var(--wp-face, #0C1714); stroke-width: 2.2; }
.ck .sh { fill: rgba(255,255,255,.24); }
.ck .tk { fill: none; stroke: var(--done-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@keyframes ckPop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
.hero .ck { top: -2px; left: -3px; width: 22px; height: 22px; }
:is(#pathmap, #deck) .node.wp.chest .ck { top: -9px; left: -9px; rotate: -45deg; }
.app.race .ck circle { stroke: rgba(14,16,18,.92); }
#app.day .ck circle { stroke: #FFFFFF; }

/* the steps inside a stage: a number until the step is done, then the tick, drawn in */
.step.ok { border-color: var(--done); }
.step.ok .si { background: var(--done); color: var(--done-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--done) 26%, transparent), inset 0 -3px 0 rgba(0,0,0,.12); }
.step .si .ckp { width: 26px; height: 26px; }
.step .si .ckp path { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; animation: ckDraw .55s ease-out both; }
@keyframes ckDraw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
/* the instructor is looking at it now: a slow dashed ring around the number */
.step.live .si { position: relative; }
.step.live .si::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px dashed var(--sky); animation: spin 7s linear infinite; pointer-events: none; }
.app.race .step.ok .si { background: var(--done); color: var(--done-ink); }
@media (min-width: 900px) { #app .slide .step .si .ckp { width: 28px; height: 28px; } }

/* ================= COINS EARNED: they fly from where they were earned into the wallet ================= */
.flycoin { position: absolute; z-index: 400; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; will-change: transform, opacity; }
.flycoin .coinic { width: 26px; height: 26px; font-size: 8px; animation: coinFlip .5s linear infinite; box-shadow: inset 0 -2px 0 var(--coin-dd), 0 3px 8px rgba(0,0,0,.35); }
@keyframes coinFlip { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.16); } }

/* ================= THE FULL PATH: the route already flown is lit, and the student's station stands out ================= */
#pathmap .trail polyline.litglow { stroke: color-mix(in srgb, var(--done) 32%, transparent); stroke-width: 18px; }
#pathmap .trail polyline.lit { stroke: var(--done); stroke-width: 6px; }
#pathmap .trail polyline.litflow { stroke: rgba(255,255,255,.95); stroke-width: 3px; stroke-dasharray: 1 14; animation: litFlow 1s linear infinite; }
@keyframes litFlow { to { stroke-dashoffset: -15; } }
#app.day #pathmap .trail polyline.litflow { stroke: rgba(255,255,255,1); }
#pathmap .node.wp.here { z-index: 2; transform: translate(-50%, -50%) scale(1.15); }
#pathmap .node.wp.here:active { transform: translate(-50%, -46%) scale(1.15); }
#pathmap .node.wp.here::before { display: block; content: ""; position: absolute; inset: -34px; z-index: -1; border: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--wp) 46%, transparent) 0%, color-mix(in srgb, var(--wp) 14%, transparent) 48%, transparent 70%); animation: hereGlow 2.6s ease-in-out infinite; }
@keyframes hereGlow { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.06); opacity: 1; } }
#pathmap .node.wp.here .nl { background: var(--wp); color: var(--ink); font-weight: 800; box-shadow: 0 0 0 3px color-mix(in srgb, var(--wp) 30%, transparent), 0 6px 14px rgba(0,0,0,.3); }
#pathmap .node.wp.here.now .nl { color: #FFFFFF; }
#app.day #pathmap .node.wp.here .nl { background: var(--wp); }

/* ================= THE HANGAR'S LICENCES: the same lenses as the full path ================= */
#badges .badge.wpb { --wp: rgba(255,255,255,.24); --wp-tick: rgba(255,255,255,.14); --wp-face: #0C1714; background: none !important; box-shadow: none !important; border-radius: 50% !important; opacity: 1 !important; filter: drop-shadow(0 6px 8px rgba(0,0,0,.32)) !important; }
#badges .badge.wpb.done { --wp: var(--done); --wp-tick: color-mix(in srgb, var(--done) 70%, transparent); }
#badges .badge.wpb .bez { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#badges .badge.wpb .bez .b-ring { stroke-width: 5; }
#badges .badge.wpb.lock .bez .b-ring { stroke-dasharray: 5 4.2; stroke-width: 3.2; }
#badges .badge.wpb .bart { inset: 15%; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.5); }
#badges .badge.wpb.lock .bart { filter: grayscale(1) brightness(.6); }
#badges .badge.wpb .glass { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(140deg, rgba(255,255,255,.4) 0%, rgba(255,255,255,.08) 30%, transparent 46%), radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.38) 100%); }
#badges .badge.wpb .ck { top: -3px; left: -3px; width: 24px; height: 24px; }
.app.race #badges .badge.wpb { --wp-face: rgba(14,16,18,.92); }
.app.race #badges .badge.wpb .bez .b-ring { stroke-width: 3.4; }
.app.mil #badges .badge.wpb .bez { display: none; }
.app.mil #badges .badge.wpb { border-radius: 6px !important; background: var(--wp-face) !important; box-shadow: inset 0 0 0 3px var(--wp), 0 5px 0 rgba(0,0,0,.35) !important; }
.app.mil #badges .badge.wpb .bart { inset: 10%; border-radius: 2px; }
#app.day #badges .badge.wpb { --wp-face: #FFFFFF; --wp-tick: rgba(0,0,0,.24); filter: drop-shadow(0 4px 8px rgba(0,0,0,.14)) !important; }
#app.day #badges .badge.wpb.lock { --wp: rgba(0,0,0,.2); }
#app.day #badges .badge.wpb.done { --wp-tick: color-mix(in srgb, var(--done) 65%, #000); }

/* ================= DAY AND NIGHT: a drawn sun or moon beside the word ================= */
.mico { width: 17px; height: 17px; flex: none; }
.mico.sun circle { fill: #FFC93C; }
.mico.sun path { fill: none; stroke: #FFC93C; stroke-width: 2.1; stroke-linecap: round; }
.mico.moon path, .mico.moon circle { fill: #C9D6FF; }
#app.day .mico.moon path, #app.day .mico.moon circle { fill: #5868B8; }
#app.day .mico.sun circle { fill: #F2A900; }
#app.day .mico.sun path { stroke: #F2A900; }
.modebtn { gap: 6px; }
.acct .modeacct { gap: 8px; }
</style>
</head>
<body>
<div class="stage">
<div class="app" id="app" dir="rtl" lang="he">
  <div class="racefx" aria-hidden="true"><div class="street"></div><div class="shade"></div><span class="sp1"></span><span class="sp2"></span><span class="sp3"></span><svg><filter id="grit"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#grit)"/></svg></div>
  <div class="themebg" id="themebg" aria-hidden="true" hidden></div>
  <div class="stagebg" id="stagebg" aria-hidden="true"><div id="sbgA"></div><div id="sbgB"></div><div id="sbgC"></div></div>

  <header class="topbar">
    <div class="avatar" id="av" aria-hidden="true"><span id="avL"></span><span class="lv coin-only" id="lvTag">LV 1</span></div>
    <div class="who">
      <b><span id="meName"></span> · <span id="rankTxt" style="color:var(--gold)"></span></b>
      <div class="xp" id="xpBar"><i id="xpFill"></i><span id="xpTxt" dir="ltr"></span></div>
    </div>
    <button class="res modebtn bellbtn" id="bellBtn" type="button" aria-label="התראות"><span class="rlbl">התראות</span><span class="tcount" id="bellN" hidden>0</span></button>
    <button class="res modebtn" id="modeBtn" type="button" aria-label="מעבר למצב יום" hidden>יום</button>
    <span class="res streakres" title="ימים ברצף"><span class="rlbl">רצף</span><span id="streakN">0</span></span>
    <span class="res coin-only" title="מטבעות בארנק"><span class="ic"><span class="coinic">88</span></span><span id="coinN">0</span></span>
  </header>
