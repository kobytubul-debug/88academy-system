    mb.setAttribute('aria-label', mode === 'day' ? 'מעבר למצב לילה' : 'מעבר למצב יום');
  };
  const applyLook = () => {
    app.classList.toggle('mil', MIL());
    app.classList.toggle('race', RACE());
    document.querySelector('[data-t="questsTitle"]').dataset.code = RACE() ? 'DAILY CHALLENGES' : 'DAILY ORDERS';
    if (!LINEMODE()) document.querySelectorAll('.licw').forEach(el => el.replaceWith(el.dataset.e));
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
    renderAll();
    lineify(app);
  };
  const applyTheme = (t) => { ACTIVE = t; LOOK = t.base; applyVars(t); applyLook(); };
  // the design page changes one thing at a time: colors and the like only need the variables, a new base style,
  // icons or words need the whole screen drawn again
  const previewTheme = (raw) => {
    const t = themeOf(raw), shape = (x) => JSON.stringify([x.base, x.icons, x.terms, (x.lens && x.lens.show) || 'auto', x.layout || 'classic', (x.show && x.show.img) || '', JSON.stringify((x.steps && x.steps.names) || {}), JSON.stringify(x.focus || {})]);
    if (ACTIVE && shape(ACTIVE) === shape(t)) { ACTIVE = t; applyVars(t); syncStageBg(); } else applyTheme(t);
  };
  // the switch shows where it leads: a sun to day, a moon to night
  const SUN = '<svg class="mico sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>';
  const MOON = '<svg class="mico moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.4 14.6A7.9 7.9 0 0 1 9.4 4.6a8.1 8.1 0 1 0 10 10z"/><circle cx="16.8" cy="5.6" r="1.15"/><circle cx="20.1" cy="9.3" r=".8"/></svg>';
  const modeLabel = (mode, long) => `${mode === 'day' ? MOON : SUN}<span>${long ? (mode === 'day' ? 'מצב לילה' : 'מצב יום') : (mode === 'day' ? 'לילה' : 'יום')}</span>`;
  const toggleMode = () => {
    if (PREVIEW) return;
    const cur = modeOf(ACTIVE);
    studentMode = cur === 'day' ? 'night' : 'day';
    try { localStorage.setItem('g88-mode', studentMode); } catch (e) {}
    applyVars(ACTIVE);
  };
  $('#modeBtn').onclick = toggleMode;

  const renderAll = () => { buildWorlds(); renderMap(); renderQuests(); if (!$('#v-league').hidden) renderLeague(); if (!$('#v-hangar').hidden) renderHangar(); hud(); checkSkins(); };

  // ---------- the welcome page (design page): after signing in, before the game starts ----------
  const WKEY = () => 'g88-welcome-' + ((A.me && (A.me.id || A.me.username)) || 'me');
  const wHash = (w) => { const x = [w.title, w.text, w.kick, w.img, w.btn].join('|'); let h = 0; for (let i = 0; i < x.length; i++) h = (h * 31 + x.charCodeAt(i)) | 0; return String(h); };
  const welcomeDue = (t) => {
    const w = t && t.welcome; if (!w || !w.on || !(w.title || w.text || w.img)) return false;
    if (w.when === 'always') { try { if (sessionStorage.getItem(WKEY())) return false; } catch (e) {} return true; }
    let seen = {}; try { seen = JSON.parse(localStorage.getItem(WKEY()) || '{}'); } catch (e) {}
    if (w.when === 'once') return seen.h !== wHash(w);
    return seen.d !== new Date().toDateString();
  };
  const markWelcome = (w) => { try { sessionStorage.setItem(WKEY(), '1'); localStorage.setItem(WKEY(), JSON.stringify({ h: wHash(w), d: new Date().toDateString() })); } catch (e) {} };
  const fillName = (x) => esc(x).replace(/\{name\}/g, esc(A.me.name || '')).replace(/\{first\}/g, esc(firstName(A.me.name || '')));
  const showWelcome = (t, then, quiet) => {
    const w = (t && t.welcome) || {}; let el = document.getElementById('welcome'); if (el) el.remove();
    el = document.createElement('div'); el.id = 'welcome'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'wcT');
    const ff = (f) => f && f !== 'default' ? `'${String(f).replace(/['\\]/g, '')}', 'Rubik', system-ui, sans-serif` : '';
    ['headF', 'bodyF'].forEach(k => { if (w[k] && w[k] !== 'default') loadFont(w[k], PAGE_FONTS); });
    const v = { '--wl-bg': w.bg, '--wl-bg2': w.bg2, '--wl-card': w.card, '--wl-fg': w.fg, '--wl-head': w.head, '--wl-kick': w.kickC, '--wl-btn': w.btnBg, '--wl-btnfg': w.btnFg, '--wl-line': w.line };
    let st = Object.keys(v).filter(k => isHex(v[k] || '')).map(k => `${k}:${v[k]}`).join(';');
    st += `;--wl-ts:${(Number(w.title_s) || 100) / 100};--wl-xs:${(Number(w.text_s) || 100) / 100};--wl-w:${Number(w.width) || 640}px;--wl-r:${w.corners == null ? 24 : Number(w.corners)}px;--wl-dim:${(w.dim == null ? 55 : Number(w.dim)) / 100};--wl-imgh:${Number(w.imgH) || 220}px`;
    if (ff(w.headF)) st += `;--wl-fh:${ff(w.headF)}`; if (ff(w.bodyF)) st += `;--wl-fb:${ff(w.bodyF)}`;
    el.className = `wl-${w.style === 'window' ? 'window' : 'page'} wl-img-${w.img ? w.imgPlace || 'top' : 'none'}${w.align === 'start' ? ' wl-start' : ''}${w.anim === false ? ' wl-still' : ''}`;
    el.style.cssText = st;
    const paras = String(w.text || '').split(/\n{2,}/).map(p => `<p>${fillName(p).replace(/\n/g, '<br>')}</p>`).join('');
    const img = w.img ? `<div class="wl-img" style="background-image:url('${esc(String(w.img).replace(/'/g, '%27'))}')" role="img" aria-label="${esc(w.title || 'תמונה')}"></div>` : '';
    el.innerHTML = `${w.img && w.imgPlace === 'bg' ? img : ''}<div class="wl-card">${w.img && w.imgPlace !== 'bg' ? img : ''}<div class="wl-body">
      ${w.kick ? `<div class="wl-kick">${fillName(w.kick)}</div>` : ''}${w.title ? `<h1 id="wcT">${fillName(w.title)}</h1>` : '<h1 id="wcT" class="vh">ברוכים הבאים</h1>'}
      <div class="wl-text">${paras}</div>
      <div class="wl-btns"><button class="wl-go" type="button" id="wcGo">${esc(w.btn || 'מתחילים')}</button>${w.btn2 && w.link2 ? `<a class="wl-alt" href="${esc(w.link2)}" target="_blank" rel="noopener">${esc(w.btn2)}</a>` : ''}</div>
      ${Number(w.auto) > 0 ? `<div class="wl-auto" aria-hidden="true"><i style="animation-duration:${Number(w.auto)}s"></i></div>` : ''}
    </div></div>`;
    if (quiet) { el.classList.add('wl-still', 'on'); }
    app.appendChild(el); requestAnimationFrame(() => el.classList.add('on'));
    let closed = false, autoT = null;
    const close = () => { if (closed) return; closed = true; clearTimeout(autoT); if (!PREVIEW) markWelcome(w); el.classList.remove('on'); setTimeout(() => { el.remove(); then && then(); }, w.anim === false ? 0 : 420); };
    el.querySelector('#wcGo').onclick = close;
    el.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    if (Number(w.auto) > 0 && !PREVIEW) autoT = setTimeout(close, Number(w.auto) * 1000);
    setTimeout(() => { const b = el.querySelector('#wcGo'); b && b.focus({ preventScroll: true }); }, 350);
  };

  // ---------- the first visit ----------
  const showIntro = () => openSheet(`<div class="kick">ברוכים הבאים</div><h2>ככה זה עובד</h2><ol class="intro">
      <li><span><b>המסלול</b>כל חלון הוא תרגיל אמיתי. גוללים למטה לתרגיל הבא, ומחליקים הצידה למפה המלאה.</span></li>
      <li><span><b>צופים ומטיסים</b>צופים בסרטון ההדגמה עד הסוף, ואז מטיסים ומצלמים את הטיסה.</span></li>
      <li><span><b>שולחים למדריך</b>מעלים את הסרטון מהמחשב או מדביקים קישור. המדריך מאשר, או מחזיר עם הערה.</span></li>
      ${EARNS() ? '<li><span><b>צוברים מטבעות</b>על תרגילים, כניסה יומית ומשימות היום. עולים בדרגה, מתחרים בליגת השבוע ומממשים בפרסים של הקבוצה.</span></li>' : ''}
    </ol><button class="btn3 gold full" type="button" id="introOk">יאללה, מתחילים</button>`, s => s.querySelector('#introOk').onclick = () => {
      A.data.progress.introSeen = true; A.request('POST', '/api/intro-seen', {}); closeSheet();
    });

  // the design page's preview: the exercise window can be dragged to its place (wide screens); the place goes back to the design page
  if (PREVIEW) {
    let drag = null;
    const handle = () => { if (innerWidth < 900) return; document.querySelectorAll('#deck .stcard, #deck .fcard').forEach(c => { if (!c.querySelector(':scope > .wc-grip')) { const g = document.createElement('button'); g.type = 'button'; g.className = 'wc-grip'; g.setAttribute('aria-label', 'גרירת חלון התרגיל'); g.textContent = '✥'; c.prepend(g); } }); };
    new MutationObserver(() => handle()).observe(document.getElementById('deck'), { childList: true, subtree: true });
    document.addEventListener('pointerdown', (e) => {
      const g = e.target.closest && e.target.closest('.wc-grip'); if (!g) return;
      e.preventDefault(); const cs = getComputedStyle(app);
      drag = { sx: e.clientX, sy: e.clientY, x: parseFloat(cs.getPropertyValue('--wc-x')) || 0, y: parseFloat(cs.getPropertyValue('--wc-y')) || 0, id: e.pointerId };
      g.setPointerCapture && g.setPointerCapture(e.pointerId); app.classList.add('wc-dragging');
    });
    document.addEventListener('pointermove', (e) => { if (!drag) return; const x = Math.round(drag.x + e.clientX - drag.sx), y = Math.round(drag.y + e.clientY - drag.sy); drag.nx = Math.max(-700, Math.min(700, x)); drag.ny = Math.max(-400, Math.min(400, y)); app.style.setProperty('--wc-x', drag.nx + 'px'); app.style.setProperty('--wc-y', drag.ny + 'px'); });
    const end = () => { if (!drag) return; const d0 = drag; drag = null; app.classList.remove('wc-dragging'); if (d0.nx == null) return; if (ACTIVE) { ACTIVE.wcard = Object.assign({}, ACTIVE.wcard, { x: d0.nx, y: d0.ny }); } try { parent.postMessage({ type: 'g88-wcpos', x: d0.nx, y: d0.ny }, location.origin); } catch (er) {} };
    document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  }
  // ---------- the design page's live preview: it sends the theme and the stage backgrounds being edited ----------
  if (PREVIEW) {
    addEventListener('message', (ev) => {
      if (ev.origin !== location.origin || ev.source !== parent) return;
      const d = ev.data || {};
      if (d.type === 'g88-theme' && d.theme) previewTheme(d.theme);
      else if (d.type === 'g88-stagebg' && d.stageBg) { PV.stageBg = d.stageBg; syncStageBg(); renderPath(); if (!$('#v-hangar').hidden) renderHangar(); }
      else if (d.type === 'g88-guide') { openGuide(); }
      else if (d.type === 'g88-welcome') { if (d.close) { const w0 = $('#welcome'); if (w0) w0.remove(); } else showWelcome(ACTIVE, null, !!$('#welcome')); }
      else if (d.type === 'g88-view' && d.view) { if (sheet.classList.contains('on')) closeSheet(); switchTab(d.view); }
      else if (d.type === 'g88-go' && d.node) {
        if (!findNode(d.node)) return;
        if (sheet.classList.contains('on')) closeSheet();
        switchTab('map'); showPane('deck', false);
        setTimeout(() => goNode(d.node, !d.jump), 60);
      }
    });
  }

  // ---------- start ----------
  app.classList.toggle('noearn', !EARNS());
  initNotes();
  applyTheme(themeOf(A.data.theme));
  checkRank();
  setTimeout(() => { const f = frontier(); if (f) goNode(f.id); syncRail(); syncPane(); }, 80);
  const startGame = () => {
    if (!PREVIEW) setTimeout(claimLogin, 900);
    if (!PREVIEW && A.data.progress && !A.data.progress.introSeen) setTimeout(showIntro, 600);
  };
  if (!PREVIEW && welcomeDue(ACTIVE)) showWelcome(ACTIVE, startGame); else startGame();
  loadLeague();
  if (PREVIEW && parent !== window) { try { parent.postMessage({ type: 'g88-ready' }, location.origin); } catch (e) {} }
})();
</script>
</body>
</html>
