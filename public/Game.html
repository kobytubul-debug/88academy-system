  const crownOf = (n) => { const s = n.t === 'skill' && n.state === 'done' ? starsOf(n.k.id) : n.t === 'boss' && n.state === 'done' ? chalStars(n.c.id) : 0; return s ? `<span class="crown">${starTxt(s)}</span>` : ''; };
  const loginDays = () => { const d = {}; P.ledger.forEach(e => { if (e.kind === 'login') d[dayOf(e.at)] = true; }); return d; };
  const streakFrom = (days) => { let d = today(); if (!days[d]) d = addDays(d, -1); let n = 0; while (days[d]) { n++; d = addDays(d, -1); } return n; };
  const streak = () => streakFrom(loginDays());
  const questState = () => {
    const t = today();
    const login = P.ledger.some(e => e.kind === 'login' && dayOf(e.at) === t);
    const video = P.questVideoDay === t;
    const flight = P.flights.some(f => dayOf(f.at) === t);
    const paid = P.ledger.some(e => e.kind === 'quests' && dayOf(e.at) === t);
    return { login, video, flight, done: (login ? 1 : 0) + (video ? 1 : 0) + (flight ? 1 : 0), paid };
  };

  // per-window state that only lives on this screen: uploads in progress, a video file waiting to be sent, errors
  const UI = {};
  const ui = (id) => UI[id] || (UI[id] = {});

  // ---------- the path: one world per level, its exercises, the level-bonus chest, the final exam at the end ----------
  // a level chest opens once: the server keeps which ones were opened, so another computer shows them open too
  const markChest = (n) => { if (P.chests.indexOf(n) === -1) { P.chests.push(n); ver++; queueSync(350); } };
  let WORLDS = [];
  const chestNode = (w, b) => {
    const e = P.ledger.find(x => x.kind === 'level' && x.level === w.n && !x.reverted);
    const done = SKILLS().filter(k => k.level === w.n).every(k => P.acquired[k.id]);
    const state = e ? (P.chests.indexOf(w.n) !== -1 ? 'opened' : 'ready') : done ? 'opened' : 'lock';
    return { id: 'c' + w.n, t: 'chest', n: w.n, bonus: e ? Number(e.amount) || b : b, got: !!e, state, name: T('chestName') };
  };
  const buildWorlds = () => {
    const L = LEVELS(), sk = SKILLS();
    const W = L.map((l, i) => ({ id: 'w' + l.n, n: l.n, i, cls: 'w' + ((i % 3) + 1), name: l.name, blurb: l.desc || '', nodes: [] }));
    sk.forEach(k => { const w = W.find(x => x.n === k.level); if (w) w.nodes.push({ id: 's' + k.id, t: 'skill', k, name: k.name, state: skillState(k) }); });
    W.forEach(w => { const b = levelBonus(w.n); if (b > 0 && w.nodes.length) w.nodes.push(chestNode(w, b)); });
    const out = W.filter(w => w.nodes.length);
    const fin = CHALS().find(c => c.final);
    if (fin) out.push({ id: 'wb', n: null, i: out.length, cls: 'wb', name: fin.title, blurb: 'המבחן המסכם של המסלול', nodes: [{ id: 'boss', t: 'boss', c: fin, name: fin.title, state: ({ done: 'done', wait: 'wait', fix: 'fix', now: 'now', lock: 'lock', ended: 'lock' })[chalState(fin)] }] });
    WORLDS = out;
  };
  const allNodes = () => WORLDS.reduce((a, w) => a.concat(w.nodes), []);
  const visibleNodes = () => allNodes().filter(n => EARNS() || n.t !== 'chest');
  const findNode = (id) => allNodes().find(n => n.id === id);
  const worldOf = (n) => WORLDS.find(w => w.nodes.indexOf(n) !== -1);
  const worldTag = (w) => w.cls === 'wb' ? T('boss') : MIL() ? `${T('world')} ${w.i + 1} · OP-0${w.i + 1}` : `${T('world')} ${w.i + 1}`;
  // where the student is: a flight sent back, else the first open exercise, else one waiting for the instructor
  const frontier = () => {
    const all = visibleNodes();
    return all.find(n => n.state === 'fix') || all.find(n => n.t === 'chest' && n.state === 'ready') || all.find(n => n.state === 'now') || all.find(n => n.state === 'wait') || all.filter(n => n.state !== 'lock').pop() || all[0];
  };

  // ---------- coins: the same rules the server checks ----------
  const award = (items, from) => {
    const before = total(), wallet = balance(), r = R();
    (items || []).forEach(it => P.ledger.push(Object.assign({ id: nid('g'), at: stamp(), skill: null }, it, { amount: EARNS() ? it.amount : 0 })));
    const q = questState();
    if (q.done === 3 && !q.paid && q.login && r.quests > 0) P.ledger.push({ id: nid('g'), at: stamp(), cat: 'bonus', kind: 'quests', text: 'משימות היום הושלמו', amount: EARNS() ? r.quests : 0, skill: null });
    changed();
    const got = total() - before;
    if (got > 0) coinBurst(from, got, wallet);
    checkRank();
  };
  // today's login: its coins, and the streak bonus when today completes 3 days or a whole week
  const claimLogin = () => {
    const t = today();
    if (P.ledger.some(e => e.kind === 'login' && dayOf(e.at) === t)) return;
    const r = R(), days = loginDays(); days[t] = true;
    const n = streakFrom(days);
    const items = [{ cat: 'habit', kind: 'login', text: 'כניסה יומית', amount: r.login }];
    const bonus = n === 3 ? r.streak3 : n > 0 && n % 7 === 0 ? r.streak7 : 0;
    if (bonus) items.push({ cat: 'habit', kind: 'streak', text: n % 7 === 0 ? (n === 7 ? 'שבוע שלם ברצף' : n + ' ימים ברצף') : n + ' ימים ברצף', amount: bonus });
    award(items, $('#streakN'));
  };
  // Coins earned burst out of where they were earned and fly into the wallet, which counts up as they land.
  // Calm mode and reduced motion show just the amount.
  const coinBurst = (from, got, countFrom) => {
    const wallet = $('#coinN'), pill = wallet && wallet.closest('.res'), target = pill && pill.querySelector('.coinic');
    if (!EARNS() || !(got > 0) || !wallet) return;
    const src = from && from.isConnected && from.getClientRects().length ? from : wallet;
    floatTxt(src, '+' + got);
    const still = app.classList.contains('calm') || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (still || src === wallet || !target || !target.animate || !target.getClientRects().length) { bump(); return; }
    const end = balance();
    if (countFrom != null) wallet.textContent = countFrom;
    const a = app.getBoundingClientRect(), sr = src.getBoundingClientRect(), tr = target.getBoundingClientRect();
    const sx = sr.left + sr.width / 2 - a.left, sy = sr.top + sr.height / 2 - a.top, dx = tr.left + tr.width / 2 - a.left - sx, dy = tr.top + tr.height / 2 - a.top - sy;
    const n = Math.max(6, Math.min(14, 4 + Math.round(got / 10)));
    let landed = 0;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('span'); c.className = 'flycoin'; c.setAttribute('aria-hidden', 'true'); c.innerHTML = '<span class="coinic">88</span>';
      c.style.left = sx + 'px'; c.style.top = sy + 'px'; app.append(c);
      const ang = (i / n) * Math.PI * 2 + Math.random() * .7, rad = 30 + Math.random() * 42;
      const bx = Math.cos(ang) * rad, by = Math.sin(ang) * rad - 16, mx = bx + (dx - bx) * .5 + (Math.random() - .5) * 80, my = by + (dy - by) * .5 - 30 - Math.random() * 50;
      const fly = c.animate([
        { transform: 'translate(0px, 0px) scale(.2)', opacity: 0 },
        { transform: `translate(${bx}px, ${by}px) scale(1.15)`, opacity: 1, offset: .22 },
        { transform: `translate(${mx}px, ${my}px) scale(.95)`, opacity: 1, offset: .62 },
        { transform: `translate(${dx}px, ${dy}px) scale(.5)`, opacity: .9 }
      ], { duration: 950 + Math.random() * 300, delay: i * 60, easing: 'cubic-bezier(.33,.1,.25,1)', fill: 'both' });
      fly.onfinish = () => {
        c.remove(); landed++;
        target.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 220 });
        if (countFrom != null) wallet.textContent = landed >= n ? end : Math.round(countFrom + (end - countFrom) * landed / n);
        if (landed >= n) bump();
      };
    }
  };
  const bump = () => { const el = $('#coinN'); if (!el || !el.parentNode || !el.parentNode.animate) return; el.parentNode.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 380 }); };

  // learning time: coins for every few minutes the site is open in front of the student, a few times a day
  setInterval(() => {
    if (PREVIEW || document.visibilityState === 'hidden') return;
    const t = today(); if (P.timeDay !== t) { P.timeDay = t; P.timeToday = 0; }
    P.timeToday = (P.timeToday || 0) + 1;
    const r = R(), got = P.ledger.filter(e => e.kind === 'time' && dayOf(e.at) === t).length;
    if (r.timePoints > 0 && got < r.timeMax && P.timeToday >= (got + 1) * r.timeStep) award([{ cat: 'habit', kind: 'time', text: ((got + 1) * r.timeMin === 1 ? 'דקת' : (got + 1) * r.timeMin + ' דקות') + ' למידה היום', amount: r.timePoints }], $('#coinN'));
    else if (P.timeToday - lastTimeSent >= 60) queueSync(0);
    if (P.timeToday % 30 === 0 && !$('#v-quests').hidden) renderQuests();
  }, 1000);

  // ---------- saving: the whole progress goes to the server, which keeps only what a student may add ----------
  let ver = 0, syncing = false, again = false, timer = null, lastTimeSent = P.timeToday || 0, netWarned = 0;
  const persist = () => ({ acquired: P.acquired, flights: P.flights, ledger: P.ledger, notifications: P.notifications, requests: P.requests, timeToday: P.timeToday || 0, timeDay: today(), questVideoDay: P.questVideoDay === today() ? today() : '', dailyDismissedDay: P.dailyDismissedDay === today() ? today() : '', seq: P.seq || 1, chests: P.chests });
  const changed = () => { ver++; queueSync(350); renderAll(); };
  const queueSync = (ms) => { if (PREVIEW || timer) return; timer = setTimeout(() => { timer = null; syncNow(); }, ms); };
  const syncNow = () => {
    if (syncing) { again = true; return; }
    syncing = true; const v = ver; lastTimeSent = P.timeToday || 0;
    A.request('PUT', '/api/progress', { progress: persist() }).then(r => {
      syncing = false;
      if (r.ok) applyServer(r.json, v);
      else if (Date.now() - netWarned > 20000) { netWarned = Date.now(); say(r.error || 'השמירה לא הצליחה. ננסה שוב בעוד רגע.', true); setTimeout(() => queueSync(0), 8000); }
      if (again) { again = false; queueSync(0); }
    });
  };
  // leaving the page: send what is not saved yet, even as the page closes
  const flush = () => {
    if (PREVIEW || (!timer && (P.timeToday || 0) === lastTimeSent)) return;
    clearTimeout(timer); timer = null; lastTimeSent = P.timeToday || 0;
    try { fetch('/api/progress', { method: 'PUT', keepalive: true, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Academy': '1' }, body: JSON.stringify({ progress: persist() }) }); } catch (e) { syncNow(); }
  };
  const pull = () => {
    if (PREVIEW || syncing || timer) return;
    const v = ver;
    A.request('GET', '/api/boot').then(r => { if (r.ok && r.json && r.json.progress) applyServer(r.json, v); });
    if (!$('#v-league').hidden) loadLeague();
  };
  setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); else flush(); });
  addEventListener('pagehide', flush);
  const applyServer = (j, v) => {
    const wasEarns = EARNS(), wasTheme = JSON.stringify(A.data.theme || null);
    ['rewards', 'scoring', 'levels', 'skills', 'challenges', 'allSkills', 'allChallenges', 'units', 'settings', 'now', 'today', 'ui', 'theme', 'stageBg'].forEach(k => { if (j[k] !== undefined) A.data[k] = j[k]; });
    if (j.me) A.data.me = A.me = j.me;
    A.data.progress = j.progress;
    synced = new Set((j.progress.requests || []).map(r => r.id));
    // the admin changed the group's design: show it now (the student's own day or night choice stays)
    const newLook = JSON.stringify(A.data.theme || null) !== wasTheme;
    // things done here while this was on its way go out with the next save: take nothing now
    if (ver !== v) { if (newLook) applyTheme(themeOf(A.data.theme)); else renderAll(); return; }
    const keepT = P.timeToday || 0, keepDay = P.timeDay;
    P = norm(j.progress);
    if (keepDay === P.timeDay) P.timeToday = Math.max(P.timeToday || 0, keepT);
    if (wasEarns !== EARNS()) app.classList.toggle('noearn', !EARNS());
    if (newLook) applyTheme(themeOf(A.data.theme)); else renderAll();
    afterServer();
  };

  // ---------- news from the instructor: approvals, flights sent back, prizes, bonuses ----------
  const IMPORTANT = ['approved', 'rejected', 'marked', 'required', 'revoked', 'reward', 'bonus', 'manual'];
  const seen = new Set();
  const showQueue = [];
  const initNotes = () => {
    P.notifications.forEach(n => seen.add(n.id));
    // what happened while the student was away: the latest few, oldest first
    P.notifications.filter(n => !n.read && IMPORTANT.indexOf(n.kind) !== -1).slice(0, 3).reverse().forEach(n => showQueue.push({ note: n.id }));
  };
  const afterServer = () => {
    P.notifications.slice().reverse().forEach(n => { if (seen.has(n.id)) return; seen.add(n.id); if (!n.read && IMPORTANT.indexOf(n.kind) !== -1) showQueue.push({ note: n.id }); });
    checkRank(); pumpNotes();
  };
  const markRead = (ids) => { let any = false; P.notifications.forEach(n => { if (ids.indexOf(n.id) !== -1 && !n.read) { n.read = true; any = true; } }); if (any) changed(); };
  let showing = false;
  const busy = () => showing || $('#reward').classList.contains('on') || !!document.querySelector('.vplayer') || sheet.classList.contains('on');
  const pumpNotes = () => {
    if (busy()) return;
    const item = showQueue.shift(); if (!item) return;
    if (item.rank != null) { showing = true; const rk = RANKS()[item.rank]; return toastOverlay(`<span class="rdrone">${skinArt(skinNow(), 'הרחפן שלך')}</span>`, `LEVEL ${item.rank + 1}!`, `${T('newRank')}: ${esc(rk ? rk.name : '')}`, 'המשך', () => { showing = false; setTimeout(pumpNotes, 250); }, true); }
    const n = P.notifications.find(x => x.id === item.note);
    if (!n || n.read) return pumpNotes();
    showing = true; markRead([n.id]);
    const done = () => { showing = false; setTimeout(pumpNotes, 250); };
    const toSkill = () => { done(); if (n.skill) { switchTab('map'); showPane('deck'); setTimeout(() => goNode('s' + n.skill, true), 300); } };
    const text = esc(n.text), pic = n.skill ? lensArt('s' + n.skill, n.kind !== 'approved' && n.kind !== 'marked') : '';
    const coins = (() => { const m = String(n.text || '').match(/\+\s*(\d+)/); return m ? Number(m[1]) : 0; })();
    if (n.kind === 'approved' || n.kind === 'marked') return toastOverlay(pic, T('lit'), text, 'יש!', toSkill, true, coins);
    if (n.kind === 'rejected') return toastOverlay(pic, T('back'), text, n.skill ? 'לתרגיל' : 'הבנתי', toSkill);
    if (n.kind === 'required') return toastOverlay(pic, 'ביצוע חוזר', text, 'לתרגיל', toSkill);
    if (n.kind === 'revoked') return toastOverlay(pic, 'חזרה לתרגול', text, 'הבנתי', toSkill);
    if (n.kind === 'reward') { const got = /נמסר/.test(n.text); return toastOverlay('', got ? 'הפרס נמסר לך!' : 'עדכון על פרס', text, got ? 'יופי' : 'הבנתי', () => { done(); if (EARNS()) switchTab('league'); }, got); }
    return toastOverlay(BIGCOIN, n.kind === 'bonus' ? 'בונוס מהמדריך' : 'עדכון מטבעות', text, 'הבנתי', done, n.kind === 'bonus', coins);
  };
  setInterval(pumpNotes, 1500);
  const RKEY = 'g88-rank-' + A.me.id;
  const checkRank = () => {
    if (PREVIEW || !EARNS()) return;
    const ri = rankIndex(total());
    let was = null; try { const v = localStorage.getItem(RKEY); was = v == null ? null : Number(v); } catch (e) {}
    try { localStorage.setItem(RKEY, String(ri)); } catch (e) {}
    if (was == null || !(ri > was)) return;
    const rk = RANKS()[ri];
    P.notifications.unshift({ id: nid('nl'), kind: 'rank', text: 'עליתם לדרגת ' + rk.name + '! צברתם ' + total() + ' מטבעות.', when: 'עכשיו', read: true });
    seen.add(P.notifications[0].id); ver++; queueSync(350);
    showQueue.push({ rank: ri }); pumpNotes();
  };

  // ---------- top bar ----------
  const hud = () => {
    const t = total(), rk = RANKS(), ri = rankIndex(t), next = rk[ri + 1];
    $('#meName').textContent = firstName(A.me.name);
    $('#avL').textContent = (A.me.name || '?').trim().charAt(0);
    $('#lvTag').textContent = 'LV ' + (ri + 1);
    $('#coinN').textContent = balance();
    $('#streakN').textContent = streak();
    if (EARNS()) {
      const lo = rk[ri].min, hi = next ? next.min : lo;
      $('#xpFill').style.width = (next ? Math.max(0, Math.min(100, (t - lo) / Math.max(1, hi - lo) * 100)) : 100) + '%';
      $('#xpTxt').textContent = next ? `${t} / ${hi}` : `${t}`; $('#xpTxt').dir = 'ltr';
      $('#xpBar').title = next ? `עוד ${hi - t} מטבעות לדרגת ${next.name}` : 'הדרגה הגבוהה ביותר';
      $('#rankTxt').textContent = rk[ri].name;
    } else {
      const sk = SKILLS(), done = sk.filter(k => P.acquired[k.id]).length;
      $('#xpFill').style.width = (sk.length ? done / sk.length * 100 : 0) + '%';
      $('#xpTxt').textContent = `${done} מתוך ${sk.length} תרגילים`; $('#xpTxt').dir = 'rtl';
      $('#xpBar').title = '';
      $('#rankTxt').textContent = 'סטודנט';
    }
    const left = 3 - questState().done; $('#qDot').textContent = left; $('#qDot').hidden = !left;
    const unread = P.notifications.filter(n => !n.read).length; $('#bellN').textContent = unread > 99 ? '99+' : unread; $('#bellN').hidden = !unread;
    $('#bellBtn').setAttribute('aria-label', unread ? `התראות, ${unread} חדשות` : 'התראות');
  };
  const floatTxt = (el, txt) => {
    if (!el) return;
    const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'float'; f.textContent = txt;
    f.style.left = (r.left - a.left + r.width / 2 - 50) + 'px'; f.style.top = (r.top - a.top - 10) + 'px';
    app.append(f); setTimeout(() => f.remove(), 1100);
  };
  let sayT = null;
  const say = (text, err) => { const s = $('#say'); s.textContent = text; s.classList.toggle('err', !!err); s.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => s.classList.remove('on'), 4200); };

  // ---------- the exercise windows ----------
  // a station's look on the path and at the top of its window: its state, and what kind of station it is
  const wpCls = (n) => { const st = n.state; return n.t === 'chest' ? 'chest ' + (st === 'ready' ? 'ready' : st === 'lock' ? 'lock' : 'opened') : (n.t === 'boss' ? 'boss ' : '') + ({ done: 'done', now: 'now', wait: 'wait', fix: 'fix', lock: 'lock' })[st]; };
  // the window's big station: the same waypoint lens as on the full path
  const heroOf = (n) => `<div class="node big wp ${wpCls(n)}${n.state === 'now' ? ' here' : ''}"><span class="face">${n.t === 'chest' ? '' : WP_BEZEL}<span class="nart" aria-hidden="true">${stageArt(n.id)}${n.state === 'now' ? '<i class="sweep"></i>' : ''}<i class="glass"></i></span>${n.t === 'boss' ? WP_RETICLE : ''}${isDone(n) ? CK : ''}</span></div>`;
  // the instructor's stars, next to the stage's name
  const titleStars = (n) => { const s = n.t === 'skill' && n.state === 'done' ? starsOf(n.k.id) : n.t === 'boss' && n.state === 'done' ? chalStars(n.c.id) : 0; return s ? `<span class="tstars">${starTxt(s)}</span>` : ''; };
  // the designed check: a disc in the "done" colour with a bold tick (on a station), and the tick alone (in a step's box)
  const CK = '<span class="ck" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="10.6"/><path class="sh" d="M1.4 12a10.6 10.6 0 0 1 21.2 0z"/><path class="tk" d="M6.9 12.5l3.4 3.4 6.9-7.3"/></svg></span>';
  const CKP = '<svg class="ckp" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.6 12.6l4.2 4.2 8.6-9"/></svg>';
  const isDone = (n) => n.state === 'done' || (n.t === 'chest' && n.state === 'opened');
  // pictures for the overlays: a stage in a round lens, and the coin
  const lensArt = (id, dim) => `<span class="rlens${dim ? ' dim' : ''}">${stageArt(id)}</span>`;
  const BIGCOIN = '<span class="coinic rcoin">88</span>';
  const prevLevelName = (lvl) => { const L = LEVELS(), i = L.findIndex(l => l.n === lvl); return i > 0 ? L[i - 1].name : 'הרמה הקודמת'; };
  const uploadUI = (n) => {
    const u = ui(n.id);

  // ---------- the league: this week's coins in the group ----------

    $('#pName').textContent = A.me.name || '';
    $('#rankBadge').textContent = EARNS() ? `${rk.name} · LV ${rankIndex(t) + 1}` : `סטודנט · ${done} מתוך ${sk.length} תרגילים`;
    $('#stFlights').textContent = P.flights.filter(f => f.status === 'approved').length;
    $('#stDone').textContent = `${done}/${sk.length}`;
    $('#stTime').textContent = Math.floor((P.timeToday || 0) / 60);
    $('#badges').innerHTML = sk.map((k) => { const got = !!P.acquired[k.id]; return `<div class="bdg"><div class="badge wpb ${got ? 'done' : 'lock'}" role="img" aria-label="${esc(k.name + (got ? ' · הושלם' : ' · עוד לא'))}">${WP_BEZEL}<span class="bart">${stageArt('s' + k.id)}<i class="glass"></i></span>${got ? CK : ''}</div><small aria-hidden="true">${esc(k.name)}</small></div>`; }).join('');
    const L = LEVELS(), lockTxt = (k) => { const lv = L[skinNeed(k) - 1]; return lv ? `נפתח בסיום ${lv.name}` : 'נעול'; };
    $('#skins').innerHTML = SKINS.map(k => { const open = skinOpen(k); return `<button class="skin ${s.id === k.id ? 'sel' : ''} ${open ? '' : 'locked'}" data-k="${k.id}" type="button" aria-pressed="${s.id === k.id}" ${open ? '' : 'aria-disabled="true"'}>${skinArt(k)}<b>${esc(skinLabel(k))}</b>${open ? `<span class="price" style="color:var(--mint)">${s.id === k.id ? 'בשימוש' : 'פתוח · לבחירה'}</span>` : `<span class="price">${esc(lockTxt(k))}</span>`}</button>`; }).join('');
    $('#skins').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = SKINS.find(x => x.id === b.dataset.k);
      if (!skinOpen(k)) { floatTxt(b, lockTxt(k)); return; }
      skinId = k.id; if (!PREVIEW) { try { localStorage.setItem(SKEY, k.id); } catch (e) {} }
      renderHangar(); renderMap();
      const again = $(`#skins [data-k="${k.id}"]`); again && again.focus();
    });
    // how coins come, with the numbers the admin set
    const r = R(), pts = sk.map(k => skillPts(k.id)).filter(Boolean), lb = LEVELS().map(l => levelBonus(l.n)).filter(Boolean);
    const span = (a) => !a.length ? '' : Math.min(...a) === Math.max(...a) ? `+${a[0]}` : `+${Math.min(...a)}–${Math.max(...a)}`;
    const rows = [[`כל תרגיל שהמדריך מאשר`, span(pts)], ['טיסה שעוברת בניסיון הראשון', r.first ? '+' + r.first : ''], ['סיום רמה', span(lb)], ['כניסה יומית', r.login ? '+' + r.login : ''], ['3 ימים ברצף', r.streak3 ? '+' + r.streak3 : ''], ['שבוע שלם ברצף', r.streak7 ? '+' + r.streak7 : ''], [`כל ${r.timeMin} דקות באתר (עד ${r.timeMax} פעמים ביום)`, r.timePoints && r.timeMax ? '+' + r.timePoints : ''], ['צפייה בסרטון הדגמה', r.video ? '+' + r.video : ''], ['שלוש משימות היום', r.quests ? '+' + r.quests : '']].filter(x => x[1]);
    $('#guide').innerHTML = rows.length ? `<div class="sect"><span>איך צוברים מטבעות</span></div><div class="guide">${rows.map(x => `<div><span>${esc(x[0])}</span><b dir="ltr">${x[1]}</b></div>`).join('')}</div>` : '';
    if (PREVIEW) { $('#acct').innerHTML = '<p class="lgempty" style="margin:0; width:100%">כאן התלמיד מחליף סיסמה. בתצוגה המקדימה הכפתור מוסתר.</p>'; return; }
    $('#acct').innerHTML = `<a href="/password">החלפת סיסמה</a>${ACTIVE && ACTIVE.allowToggle ? `<button class="modeacct" type="button" id="modeAcct">${modeLabel(modeOf(ACTIVE), true)}</button>` : ''}`;
    const ma = $('#modeAcct'); if (ma) ma.onclick = toggleMode;
  };

  // ---------- notifications ----------
  const openBell = () => {
    const list = P.notifications.filter(n => n.kind !== 'submitted').slice(0, 40);
    const unread = P.notifications.filter(n => !n.read).map(n => n.id);
    openSheet(`<div class="kick">התראות</div><h2>מה חדש</h2>${list.length ? `<div class="nlist">${list.map(n => `<button class="nrow ${n.read ? '' : 'unread'}" type="button" data-id="${esc(n.id)}"><i class="nd"></i><span>${esc(n.text)}<small>${esc(n.at ? agoText(n.at) : n.when || '')}</small></span></button>`).join('')}</div>` : '<p class="nempty">אין התראות עדיין.</p>'}<div style="height:14px"></div><button class="btn3 ghost full" type="button" id="bellX">סגירה</button>`, s => {
      s.querySelector('#bellX').onclick = closeSheet;
      s.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
        const n = P.notifications.find(x => x.id === b.dataset.id); closeSheet();
        if (!n) return;
        if (n.skill) { switchTab('map'); showPane('deck'); setTimeout(() => goNode('s' + n.skill, true), 320); }
        else if (n.reward && EARNS()) switchTab('league');
        else if (n.kind === 'rank') switchTab('hangar');
      });
    });
    showQueue.length = 0;
    if (unread.length) markRead(unread);
  };
  $('#bellBtn').onclick = openBell;

  // ---------- tabs ----------
  const switchTab = (v) => {
    if (v === 'league' && !EARNS()) v = 'map';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
    document.querySelectorAll('.views > .view').forEach(x => x.hidden = x.id !== 'v-' + v);
    $('#rail').hidden = v !== 'map'; $('#peek').hidden = v !== 'map'; $('#stagebg').hidden = v !== 'map'; if (v === 'map') setTimeout(() => { syncRail(); syncPane(); }, 0);
    if (v === 'quests') renderQuests();
    if (v === 'league') { renderLeague(); loadLeague(); }
    if (v === 'hangar') renderHangar();
  };
  document.querySelectorAll('.tab[data-v]').forEach(t => t.onclick = () => switchTab(t.dataset.v));
  const askLogout = () => openSheet(`<div class="kick">החשבון שלי</div><h2>לצאת מהחשבון?</h2><p class="desc">ההתקדמות שלך שמורה. בכניסה הבאה ממשיכים מאותה נקודה.</p><div style="height:14px"></div><div class="row2"><button class="btn3 pink" type="button" id="outYes">יציאה</button><button class="btn3 ghost" type="button" id="outNo">להישאר</button></div>`, s => {
    s.querySelector('#outYes').onclick = () => { flush(); A.logout(); };
    s.querySelector('#outNo').onclick = () => { closeSheet(); const b = $('#outBtn'); b && b.focus(); };
  });
  $('#outBtn').hidden = PREVIEW;
  $('#outBtn').onclick = askLogout;

  // ---------- theme: the group's design (base style, day/night, colors, fonts, icons, background, words, motion) ----------
  const newTheme = (base) => ({ id: 't-' + base, name: BASES[base].name, base, mode: 'night', allowToggle: true, colors: {}, surf: { night: {}, day: {} }, fonts: { head: 'default', body: 'default' }, icons: BASES[base].icons, bg: { kind: 'look' }, stageBg: true, terms: {}, motion: 'full' });
  // what the server sent, with every part filled in
  const themeOf = (t) => {
    const base = t && BASES[t.base] ? t.base : 'race', d = newTheme(base);
    if (!t || typeof t !== 'object') return d;
    return Object.assign(d, t, { base, colors: Object.assign({}, t.colors), surf: { night: Object.assign({}, t.surf && t.surf.night), day: Object.assign({}, t.surf && t.surf.day) }, fonts: Object.assign({ head: 'default', body: 'default' }, t.fonts), bg: t.bg && t.bg.kind ? t.bg : { kind: 'look' }, terms: Object.assign({}, t.terms) });
  };
  let studentMode = null;
  if (!PREVIEW) { try { studentMode = localStorage.getItem('g88-mode'); } catch (e) {} }
  const modeOf = (t) => !PREVIEW && t.allowToggle && (studentMode === 'day' || studentMode === 'night') ? studentMode : t.mode === 'day' ? 'day' : 'night';
  const MANAGED = ['--pink', '--pink-d', '--pink-dd', '--mint', '--mint-d', '--mint-dd', '--green', '--gold', '--gold-d', '--gold-dd', '--sky', '--sky-d', '--night', '--night2', '--panel', '--bar', '--white', '--dim', '--d-bg', '--d-bg2', '--d-card', '--d-fg', '--d-dim', '--d-lock', '--d-lock2', '--f', '--fh', '--n',
    '--c-done', '--done-ink', '--c-fix', '--lock', '--lock-d', '--coin', '--coin-d', '--coin-dd', '--coin-ink', '--c-xp', '--c-menu', '--menu-ink'];
  // the fonts this page loads anyway; any other font a theme picks is loaded when it is needed
  const PAGE_FONTS = new Set(['Assistant', 'Black Ops One', 'Heebo', 'Secular One', 'Suez One', 'Varela Round', 'Karantina', 'Open Sans', 'Russo One', 'Rubik', 'Unbounded']);
  const applyVars = (t) => {
    const st = app.style, mode = modeOf(t), base = t.base, co = t.colors || {};
    MANAGED.forEach(p => st.removeProperty(p));
    const set = (p, v) => st.setProperty(p, v);
    if (isHex(co.accent || '')) { set('--pink', co.accent); set('--pink-d', shade(co.accent, .2)); set('--pink-dd', shade(co.accent, .45)); }
    if (isHex(co.accent2 || '')) { set('--mint', co.accent2); set('--mint-d', shade(co.accent2, .2)); set('--mint-dd', shade(co.accent2, .45)); if (base === 'race') set('--green', co.accent2); }
    if (isHex(co.gold || '')) { set('--gold', co.gold); set('--gold-d', shade(co.gold, .18)); set('--gold-dd', shade(co.gold, .5)); }
    if (isHex(co.sky || '')) { set('--sky', co.sky); set('--sky-d', shade(co.sky, .25)); }
    // the extra roles: the stations' states, the coin, the progress bars and the menu (each only when the theme sets it)
    if (isHex(co.done || '')) { set('--c-done', co.done); set('--done-ink', inkOn(co.done)); }
    if (isHex(co.fix || '')) set('--c-fix', co.fix);
    if (isHex(co.lock || '')) { set('--lock', co.lock); set('--lock-d', shade(co.lock, .35)); }
    if (isHex(co.coin || '')) { set('--coin', co.coin); set('--coin-d', shade(co.coin, .18)); set('--coin-dd', shade(co.coin, .5)); set('--coin-ink', inkOn(co.coin) === '#ffffff' ? '#ffffff' : shade(co.coin, .6)); }
    if (isHex(co.xp || '')) set('--c-xp', co.xp);
    if (isHex(co.menu || '')) { set('--c-menu', co.menu); set('--menu-ink', inkOn(co.menu)); }
    app.classList.toggle('cdone', isHex(co.done || ''));
    app.classList.toggle('ccoin', isHex(co.coin || ''));
    app.classList.toggle('cxp', isHex(co.xp || ''));
    app.classList.toggle('cmenu', isHex(co.menu || ''));
    const so = (t.surf && t.surf[mode]) || {}, S = Object.assign({}, BASES[base].surf[mode], so);
    if (mode === 'night') {
      if (isHex(so.bg || '')) { set('--night', so.bg); set('--night2', mix(so.bg, '#ffffff', .06)); }
      if (isHex(so.card || '')) set(base === 'race' ? '--bar' : '--panel', so.card);
      if (isHex(so.text || '')) set('--white', so.text);
      if (isHex(so.dim || '')) set('--dim', so.dim);
      else if (so.text || so.bg) set('--dim', mix(S.text, S.bg, .38));
    } else {
      set('--d-bg', S.bg); set('--d-bg2', mix(S.bg, '#ffffff', .45)); set('--d-card', S.card); set('--d-fg', S.text);
      set('--d-dim', isHex(so.dim || '') ? so.dim : mix(S.text, S.bg, .4));
      if (isHex(co.lock || '')) { set('--d-lock', co.lock); set('--d-lock2', shade(co.lock, .2)); } else { set('--d-lock', mix(S.text, S.card, .1)); set('--d-lock2', mix(S.text, S.card, .2)); }
      if (base === 'race') set('--bar', S.card);
    }
    const F = t.fonts || {}, fam = (f) => `'${String(f).replace(/['\\]/g, '')}', 'Rubik', system-ui, sans-serif`;
    if (F.body && F.body !== 'default') { set('--f', fam(F.body)); loadFont(F.body, PAGE_FONTS); }
    if (F.head && F.head !== 'default') { set('--fh', fam(F.head)); loadFont(F.head, PAGE_FONTS); }
    if (F.num && F.num !== 'default') { set('--n', fam(F.num)); loadFont(F.num, PAGE_FONTS); }
    app.classList.toggle('fh', !!(F.head && F.head !== 'default'));
    app.classList.toggle('day', mode === 'day');
    app.classList.toggle('calm', t.motion === 'calm');
    // the theme's own background, behind every screen (a stage with a background of its own shows that one on top)
    const tb = $('#themebg'), bg = t.bg || { kind: 'look' }, key = JSON.stringify(bg);
    const has = (bg.kind === 'color' && isHex(bg.color || '')) || (bg.kind === 'scene' && !!SCN[bg.id]) || (bg.kind === 'img' && !!bg.url);
    app.classList.toggle('tbg', has);
    if (tb.dataset.key !== key) {
      tb.dataset.key = key; tb.innerHTML = '';
      if (bg.kind === 'color' && has) tb.innerHTML = `<div class="tbg-color" style="background:linear-gradient(180deg, ${mix(bg.color, '#ffffff', .07)}, ${bg.color})"></div>`;
      else if (bg.kind === 'scene' && has) tb.innerHTML = SCN[bg.id] + '<div class="sbg-shade"></div>';
      else if (bg.kind === 'img' && has) { const d = document.createElement('div'); d.className = 'sbg-img' + (bg.blur === false ? ' sharp' : ''); d.style.backgroundImage = `url("${cssUrl(bg.url)}")`; tb.append(d); tb.insertAdjacentHTML('beforeend', '<div class="sbg-shade"></div>'); }
    }
    tb.hidden = !has;
    $('#stagebg').classList.toggle('off', t.stageBg === false);
    const mb = $('#modeBtn');
    mb.hidden = !t.allowToggle || PREVIEW;
    mb.innerHTML = modeLabel(mode);
    const ma = $('#modeAcct'); if (ma) ma.innerHTML = modeLabel(mode, true);
    mb.setAttribute('aria-label', mode === 'day' ? 'מעבר למצב לילה' : 'מעבר למצב יום');
  };
  const applyLook = () => {
    app.classList.toggle('mil', MIL());
    app.classList.toggle('race', RACE());
    document.querySelector('[data-t="questsTitle"]').dataset.code = RACE() ? 'DAILY CHALLENGES' : 'DAILY ORDERS';
    if (!LINEMODE()) document.querySelectorAll('.licw').forEach(el => el.replaceWith(el.dataset.e));
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
    renderAll();
    lineify(app);
  };
  const applyTheme = (t) => { ACTIVE = t; LOOK = t.base; applyVars(t); applyLook(); };
  // the design page changes one thing at a time: colors and the like only need the variables, a new base style,
  // icons or words need the whole screen drawn again
  const previewTheme = (raw) => {
    const t = themeOf(raw), shape = (x) => JSON.stringify([x.base, x.icons, x.terms]);
    if (ACTIVE && shape(ACTIVE) === shape(t)) { ACTIVE = t; applyVars(t); syncStageBg(); } else applyTheme(t);
  };
  // the switch shows where it leads: a sun to day, a moon to night
  const SUN = '<svg class="mico sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>';
  const MOON = '<svg class="mico moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.4 14.6A7.9 7.9 0 0 1 9.4 4.6a8.1 8.1 0 1 0 10 10z"/><circle cx="16.8" cy="5.6" r="1.15"/><circle cx="20.1" cy="9.3" r=".8"/></svg>';
  const modeLabel = (mode, long) => `${mode === 'day' ? MOON : SUN}<span>${long ? (mode === 'day' ? 'מצב לילה' : 'מצב יום') : (mode === 'day' ? 'לילה' : 'יום')}</span>`;
  const toggleMode = () => {
    if (PREVIEW) return;
    const cur = modeOf(ACTIVE);
    studentMode = cur === 'day' ? 'night' : 'day';
    try { localStorage.setItem('g88-mode', studentMode); } catch (e) {}
    applyVars(ACTIVE);
  };
  $('#modeBtn').onclick = toggleMode;

  const renderAll = () => { buildWorlds(); renderMap(); renderQuests(); if (!$('#v-league').hidden) renderLeague(); if (!$('#v-hangar').hidden) renderHangar(); hud(); checkSkins(); };

  // ---------- the first visit ----------
  const showIntro = () => openSheet(`<div class="kick">ברוכים הבאים</div><h2>ככה זה עובד</h2><ol class="intro">
      <li><span><b>המסלול</b>כל חלון הוא תרגיל אמיתי. גוללים למטה לתרגיל הבא, ומחליקים הצידה למפה המלאה.</span></li>
      <li><span><b>צופים ומטיסים</b>צופים בסרטון ההדגמה עד הסוף, ואז מטיסים ומצלמים את הטיסה.</span></li>
      <li><span><b>שולחים למדריך</b>מעלים את הסרטון מהמחשב או מדביקים קישור. המדריך מאשר, או מחזיר עם הערה.</span></li>
      ${EARNS() ? '<li><span><b>צוברים מטבעות</b>על תרגילים, כניסה יומית ומשימות היום. עולים בדרגה, מתחרים בליגת השבוע ומממשים בפרסים של הקבוצה.</span></li>' : ''}
    </ol><button class="btn3 gold full" type="button" id="introOk">יאללה, מתחילים</button>`, s => s.querySelector('#introOk').onclick = () => {
      A.data.progress.introSeen = true; A.request('POST', '/api/intro-seen', {}); closeSheet();
    });

  // ---------- the design page's live preview: it sends the theme and the stage backgrounds being edited ----------
  if (PREVIEW) {
    addEventListener('message', (ev) => {
      if (ev.origin !== location.origin || ev.source !== parent) return;
      const d = ev.data || {};
      if (d.type === 'g88-theme' && d.theme) previewTheme(d.theme);
      else if (d.type === 'g88-stagebg' && d.stageBg) { PV.stageBg = d.stageBg; syncStageBg(); renderPath(); if (!$('#v-hangar').hidden) renderHangar(); }
      else if (d.type === 'g88-go' && d.node) {
        if (!findNode(d.node)) return;
        if (sheet.classList.contains('on')) closeSheet();
        switchTab('map'); showPane('deck', false);
        setTimeout(() => goNode(d.node, !d.jump), 60);
      }
    });
  }

  // ---------- start ----------
  app.classList.toggle('noearn', !EARNS());
  initNotes();
  applyTheme(themeOf(A.data.theme));
  checkRank();
  setTimeout(() => { const f = frontier(); if (f) goNode(f.id); syncRail(); syncPane(); }, 80);
  if (!PREVIEW) setTimeout(claimLogin, 900);
  if (!PREVIEW && A.data.progress && !A.data.progress.introSeen) setTimeout(showIntro, 600);
  loadLeague();
  if (PREVIEW && parent !== window) { try { parent.postMessage({ type: 'g88-ready' }, location.origin); } catch (e) {} }
})();
</script>
</body>
