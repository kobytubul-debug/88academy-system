<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עיצוב האתר</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=Assistant:wght@400;700;800&family=Heebo:wght@400;700;900&family=Secular+One&family=Suez+One&family=Varela+Round&family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* the admin site's look (same as the design-tool pages) */
html, body { margin: 0; }
body { background: #F5F6F4; color: #1E2320; font-family: 'Rubik', system-ui, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; color-scheme: light; }
a { color: #17694F; }
a:hover { color: #0E4F3A; }
.pill-hover:hover { background: #EEF1EF !important; color: #121413 !important; }
.btn-ghost:hover { background: #EEF1EF !important; border-color: #B9C2BD !important; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid #C7436A; outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
/* ================= DESIGN STUDIO: themes for the game, and a background per stage ================= */
.ws { display: grid; grid-template-columns: minmax(0, 1fr); }
.ed { display: flex; flex-direction: column; min-width: 0; background: #F5F6F4; }
.ed-head { padding: 18px clamp(16px, 3vw, 24px) 0; }
.ed-hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ed-head h1 { margin: 0; font-family: 'Karantina', 'Rubik', system-ui, sans-serif; font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: .005em; color: #121413; }
.ed-hrow .ed-peek { margin-inline-start: auto; }
.ed-sub { margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #545D58; }
.ed-tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid #D3D9D5; }
.ed-tabs button { height: 44px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: #545D58; font: 600 15px 'Rubik', sans-serif; cursor: pointer; }
.ed-tabs button:hover { color: #121413; }
.ed-tabs button[aria-selected="true"] { color: #121413; border-bottom-color: #C7436A; }
.ed-body { display: flex; flex-direction: column; gap: 12px; padding: 14px clamp(16px, 3vw, 24px) 24px; }
.ed-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px clamp(16px, 3vw, 24px) calc(env(safe-area-inset-bottom, 0px) + 12px); background: #FFFFFF; border-top: 1px solid #E1E5E2; }

.st-sec { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: 16px; border: 1px solid #E1E5E2; background: #FFFFFF; }
.st-sec h2 { margin: 0; font-size: 16px; font-weight: 600; color: #121413; }
.st-h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: #3D4541; }
.st-hint { margin: -4px 0 0; font-size: 13px; line-height: 1.5; color: #545D58; }
.st-now { margin: 0; font-size: 14px; color: #3D4541; }
.st-themes { display: flex; flex-direction: column; gap: 8px; }
.st-theme { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; border: 1.5px solid #E1E5E2; }
.st-theme.on { border-color: #2A9171; box-shadow: 0 0 0 3px #D3F4E6; }
.st-pick { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; align-items: center; padding: 2px; border: 0; background: none; color: inherit; font: inherit; text-align: start; cursor: pointer; }
.st-sw { grid-row: span 2; display: flex; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.14); }
.st-sw i { display: block; width: 11px; height: 30px; }
.st-pick b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-pick small { font-size: 12px; color: #545D58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-tact { display: flex; align-items: center; gap: 2px; flex: none; }
.st-delq { font-size: 13px; font-weight: 600; color: #B3261E; padding: 0 4px; }
.st-link { height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: #17694F; font: 500 13px 'Rubik', sans-serif; cursor: pointer; }
.st-link:hover { background: #EEFAF5; }
.st-link.danger { color: #B3261E; }
.st-link.danger:hover { background: #FDECEA; }
.st-link:disabled { opacity: .45; cursor: default; }
.st-newrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.st-bases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st-base { padding: 0; border-radius: 12px; border: 2px solid #E1E5E2; background: #FFFFFF; color: inherit; font: inherit; text-align: start; overflow: hidden; cursor: pointer; }
.st-base.on { border-color: #2A9171; box-shadow: 0 0 0 3px #D3F4E6; }
.st-base .pv { position: relative; display: block; height: 62px; overflow: hidden; }
.st-base .pv span { position: absolute; display: block; }
.st-base b { display: block; padding: 6px 8px 8px; font-size: 13px; font-weight: 600; }
.st-seg { display: inline-flex; align-self: flex-start; flex-wrap: wrap; border: 1.5px solid #D3D9D5; border-radius: 10px; overflow: hidden; background: #FFFFFF; }
.st-seg button { height: 40px; padding: 0 16px; border: 0; background: none; color: #3D4541; font: 600 14px 'Rubik', sans-serif; cursor: pointer; }
.st-seg button + button { border-inline-start: 1.5px solid #D3D9D5; }
.st-seg button.on { background: #121413; color: #FFFFFF; }
.st-check { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.45; cursor: pointer; }
.st-check input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: #2A9171; }
.st-check.off { opacity: .5; cursor: default; }
.st-pals { display: flex; flex-wrap: wrap; gap: 6px; }
.st-pal { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 8px; border-radius: 99px; border: 1px solid #D3D9D5; background: #FFFFFF; color: #1E2320; font: 13px 'Rubik', sans-serif; cursor: pointer; }
.st-pal:hover { border-color: #9FDDC4; background: #EEFAF5; }
.st-pal span { display: inline-flex; }
.st-pal i { display: block; width: 12px; height: 12px; border-radius: 50%; margin-inline-end: -3px; box-shadow: 0 0 0 1.5px #FFFFFF; }
.st-colors { display: flex; flex-direction: column; gap: 8px; }
.st-color { display: grid; grid-template-columns: minmax(0, 1fr) 46px 96px 30px; align-items: center; gap: 8px; }
.st-color label { font-size: 14px; font-weight: 500; min-width: 0; }
.st-color label small { display: block; font-size: 12px; font-weight: 400; color: #6B746F; }
.st-color input[type="color"] { width: 46px; height: 36px; padding: 2px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; cursor: pointer; box-sizing: border-box; }
.st-hex { width: 100%; height: 36px; padding: 0 8px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; color: #1E2320; font: 13px 'IBM Plex Mono', ui-monospace, Menlo, monospace; text-transform: uppercase; box-sizing: border-box; }
.st-hex.bad { border-color: #B3261E; }
.st-reset { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: #545D58; font-size: 17px; cursor: pointer; }
.st-reset:hover { background: #F2F4F3; }
.st-warn { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FFF4E5; color: #8A4B12; font-size: 13px; line-height: 1.45; }
.st-terms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.st-fonts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.st-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 13px; font-weight: 500; color: #3D4541; }
.st-field input, .st-field select { width: 100%; height: 38px; padding: 0 10px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; color: #1E2320; font: 14px 'Rubik', sans-serif; box-sizing: border-box; }
.st-field input::placeholder { color: #8A938E; }
.st-field input:focus, .st-field select:focus, .st-hex:focus, .st-saveas input:focus, .st-group select:focus { outline: none; border-color: #2A9171; box-shadow: 0 0 0 3px #D3F4E6; }
.st-sample { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F2F4F3; }
.st-sample b { font-size: 28px; line-height: 1.1; font-weight: 800; }
.st-sample span { font-size: 14px; color: #3D4541; }
.st-sample .st-num { font-size: 20px; font-weight: 700; color: #1E2320; letter-spacing: .02em; }
.st-cur { font-weight: 500; color: #17694F; }
/* a font picker: every font written in itself, grouped, in a box that scrolls */
.st-fontgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; max-height: 286px; overflow-y: auto; padding: 2px 2px 6px; margin-top: 2px; overscroll-behavior: contain; }
.st-fg { grid-column: 1 / -1; margin-top: 6px; font-size: 12px; font-weight: 600; color: #6B746F; }
.st-ft { display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-width: 0; padding: 9px 10px 7px; border: 2px solid transparent; border-radius: 12px; background: #F2F4F3; color: #1E2320; text-align: start; cursor: pointer; }
.st-ft:hover { background: #E8ECEA; }
.st-ft.on { border-color: #2A9171; background: #EEFAF5; box-shadow: 0 0 0 3px #D3F4E6; }
.st-ft .ft-s { font-size: 21px; line-height: 1.25; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-ft small { font: 400 11.5px 'Rubik', sans-serif; color: #6B746F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: right; }
.st-ft:focus-visible { outline: 3px solid #2A9171; outline-offset: 2px; }
.st-groups { display: flex; flex-direction: column; gap: 6px; }
.st-group { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 210px); align-items: center; gap: 4px 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #E1E5E2; }
.st-group.mine { background: #F2FBF7; border-color: #BFE6D5; }
.st-group label { min-width: 0; font-size: 14px; font-weight: 500; }
.st-group label small { display: block; font-size: 12px; font-weight: 400; color: #545D58; }
.st-group label small.chg { color: #9C5A1E; font-weight: 600; }
.st-group select { width: 100%; height: 38px; padding: 0 8px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; color: #1E2320; font: 14px 'Rubik', sans-serif; }
@media (max-width: 520px) { .st-group { grid-template-columns: minmax(0, 1fr); } }
.st-err { margin: 0; font-size: 13px; font-weight: 600; color: #B3261E; }
.st-ok { color: #17694F; font-weight: 600; }
.st-dirty { color: #9C5A1E; font-weight: 600; }
.st-status { flex: 1; min-width: 140px; font-size: 13px; color: #545D58; }
.st-ask { width: 100%; margin: 0; font-size: 14px; font-weight: 600; color: #8A4B12; }
.st-fbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.st-btn { height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid #D3D9D5; background: #FFFFFF; color: #1E2320; font: 600 14px 'Rubik', sans-serif; cursor: pointer; white-space: nowrap; }
.st-btn:hover { border-color: #9FDDC4; background: #F7FBF9; }
.st-btn.primary { border-color: #C7436A; background: #C7436A; color: #FFFFFF; }
.st-btn.primary:hover { background: #B13A5D; }
.st-btn:disabled { opacity: .45; cursor: default; }
.st-saveas { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.st-saveas input { flex: 1; min-width: 160px; height: 42px; padding: 0 12px; border: 1px solid #D3D9D5; border-radius: 10px; font: 15px 'Rubik', sans-serif; color: #1E2320; box-sizing: border-box; }
.st-up { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.st-up small { font-size: 12px; color: #6B746F; }
.st-up.over { outline: 2px dashed #2A9171; outline-offset: 4px; border-radius: 8px; }

/* background tiles */
.bgopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.bgt { padding: 0 0 6px; border: 2px solid transparent; border-radius: 12px; background: #F2F4F3; color: #1E2320; font: inherit; text-align: center; cursor: pointer; overflow: hidden; }
.bgt:hover { background: #E8ECEA; }
.bgt.sel { border-color: #2A9171; box-shadow: 0 0 0 3px #D3F4E6; }
.bgpv { position: relative; display: block; height: 58px; overflow: hidden; background: #1B1F1E; }
.bgl { display: block; margin-top: 5px; padding: 0 6px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bgimg, .bgnone, .bgcol { position: absolute; inset: 0; background: center / cover no-repeat; }
/* an uploaded image: its own delete button in the corner, and the question under the tiles */
.bgt-w { position: relative; display: grid; }
.bgt-w > .bgt { width: 100%; }
.bgx { position: absolute; top: 4px; inset-inline-end: 4px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1.5px solid rgba(255,255,255,.9); border-radius: 50%; background: rgba(16,18,20,.72); color: #FFFFFF; font: 700 13px/1 'Rubik', sans-serif; cursor: pointer; }
.bgx:hover, .bgx:focus-visible { background: #B3261E; border-color: #FFFFFF; }
.bgx:focus-visible { outline: 3px solid #F2B8B5; outline-offset: 1px; }
.bgt-w.del > .bgt { border-color: #B3261E; box-shadow: 0 0 0 3px #FDECEA; }
.bgt-w.del .bgx { background: #B3261E; }
.bgdel-box { margin-top: 10px; padding: 12px 14px; border: 1px solid #F2B8B5; border-radius: 12px; background: #FDF3F2; color: #5C1A15; font-size: 13px; line-height: 1.5; }
.bgdel-box p { margin: 0 0 6px; }
.bgdel-box b { color: #8C1D18; }
.bgdel-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.st-btn.danger { border-color: #B3261E; background: #B3261E; color: #FFFFFF; }
.st-btn.danger:hover { background: #941F19; }
.bgnone { display: grid; place-items: center; background: linear-gradient(135deg, #2A3330, #141A18); color: #C9D0CC; font-size: 11px; font-weight: 600; }
.bgpv .scn, .sb-thumb .scn { inset: 0; }
.bgpv .scn, .bgpv .scn > i, .sb-thumb .scn, .sb-thumb .scn > i { filter: none !important; }

/* the stages of the path */
.sb-world { display: flex; flex-direction: column; border: 1px solid #E1E5E2; border-radius: 14px; background: #FFFFFF; overflow: hidden; }
.sb-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 1px 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; border-top: 1px solid #EEF1EF; border-inline-start: 4px solid transparent; background: #FFFFFF; color: inherit; font: inherit; text-align: start; cursor: pointer; }
.sb-row:first-child { border-top: 0; }
.sb-row:hover { background: #F7FBF9; }
.sb-row.lvl { background: #F7F8F7; }
.sb-row.lvl b { font-size: 15px; }
.sb-row.on { background: #EEFAF5; border-inline-start-color: #2A9171; }
.sb-row b { min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-row small { grid-column: 2; min-width: 0; font-size: 12px; color: #545D58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-row small.own { color: #17694F; font-weight: 600; }
.sb-thumb { grid-row: span 2; position: relative; width: 58px; height: 38px; border-radius: 8px; overflow: hidden; background: #1B1F1E; }
.sb-sub { padding-inline-start: 26px; }
.sb-list { display: flex; flex-direction: column; gap: 8px; }
.sb-warn { margin: 0; padding: 10px 12px; border-radius: 12px; background: #FFF4E5; color: #8A4B12; font-size: 13px; line-height: 1.45; }

/* the live preview */
.pv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #D9DFDB; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid #E1E5E2; }
.pv-unit { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; color: #3D4541; }
.pv-unit select { height: 38px; max-width: 240px; min-width: 0; padding: 0 8px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; color: #121413; font: 14px 'Rubik', sans-serif; }
.pv-theme { min-width: 0; font-size: 13px; color: #545D58; }
.pv-sp { flex: 1; }
.pv-note { margin: 0; padding: 8px 16px; background: #FFF4E5; color: #8A4B12; font-size: 13px; }
.pv-frame { flex: 1; min-height: 0; display: flex; justify-content: center; }
.pv-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #0E1F1C; }
.pv.phone .pv-frame { padding: 18px; }
.pv.phone .pv-frame iframe { width: 390px; max-width: 100%; border-radius: 24px; box-shadow: 0 0 0 8px #121413, 0 18px 50px rgba(0,0,0,.3); }
@media (min-width: 1200px) {
  body.studio-page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  body.studio-page > header { flex: none; }
  .ws { flex: 1; min-height: 0; grid-template-columns: 470px minmax(0, 1fr); }
  .ed { min-height: 0; border-inline-end: 1px solid #D3D9D5; }
  .ed-body { flex: 1; min-height: 0; overflow-y: auto; }
  .ed-peek, .pv-back { display: none; }
}
@media (max-width: 1199px) {
  .pv { position: fixed; inset: 0; z-index: 100; visibility: hidden; padding-top: env(safe-area-inset-top, 0px); }
  body.peek .pv { visibility: visible; }
  body.peek { overflow: hidden; }
  .ed-foot { position: sticky; bottom: 0; z-index: 5; }
  .pv-dev { display: none; }
}
@media (max-width: 480px) { .st-color { grid-template-columns: minmax(0, 1fr) 44px 84px 28px; } .st-bases { gap: 6px; } .st-terms { grid-template-columns: minmax(0, 1fr); } }
.studio-page button:focus-visible, .studio-page input:focus-visible, .studio-page select:focus-visible { outline: 3px solid #2A9171; outline-offset: 2px; }
/* folding sections (colours, fonts, groups): a heading row that opens and closes, with a short summary */
.st-fold { display: block; padding: 0; }
.st-fold > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; border-radius: 16px; }
.st-fold > summary::-webkit-details-marker { display: none; }
.st-fold > summary:hover { background: #F7F9F8; }
.st-fold > summary:focus-visible { outline: 2px solid #2A9171; outline-offset: 2px; }
.st-fold > summary h2 { flex: none; }
.st-fold .st-sum { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #545D58; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-fold .st-sum .chg { color: #9C5A1E; font-weight: 600; }
.st-fold .st-chev { flex: none; width: 9px; height: 9px; border-left: 2px solid #545D58; border-bottom: 2px solid #545D58; transform: rotate(-45deg); margin: -4px 4px 0 2px; transition: transform .15s; }
.st-fold[open] .st-chev { transform: rotate(135deg); margin-top: 4px; }
.st-fold[open] > summary { border-bottom: 1px solid #E8EBE9; border-radius: 16px 16px 0 0; }
.st-foldin { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; }
.st-fsels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.st-fsel select { font-size: 15px; }
.st-sum .st-sw i { height: 18px; }
.st-flow { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #F2F4F3; }
/* grouped, folding design page */
.st-grp { margin: 22px 4px 2px; display: flex; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: .06em; color: #2A9171; text-transform: uppercase; }
.st-grp small { font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: #545D58; text-transform: none; }
.st-foldbar { display: flex; justify-content: flex-end; gap: 14px; margin: 4px 4px -6px; }
.st-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid #DCE3E0; background: #FBFCFC; }
.st-box.off { opacity: .6; }
.st-boxhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-boxhead b { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-boxhead span { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #E6F4EF; color: #1F6E55; }
.st-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .st-two { grid-template-columns: 1fr; } }
.st-field textarea, .st-field select { font: inherit; padding: 10px 12px; border: 1px solid #CED6D2; border-radius: 10px; background: #fff; width: 100%; box-sizing: border-box; }
