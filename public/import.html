<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ייבוא נתונים - FPV NEXUS</title>
<style>body{font-family:system-ui,sans-serif;background:#0b0c0e;color:#fff;max-width:520px;margin:40px auto;padding:0 16px;line-height:1.6}input,button{font:inherit;padding:9px;margin:4px 0;width:100%;box-sizing:border-box}button{background:#4fa3c7;border:0;color:#06222b;font-weight:700;cursor:pointer}input{background:#14171c;color:#fff;border:1px solid #444}#m{margin-top:12px;min-height:24px}</style></head>
<body><h2>ייבוא נתונים למשחק</h2>
<p>טוענים את קובץ הייצוא של הקבוצות, החשבונות והמסלולים הקיימים. פעולה זו מחליפה מסמכים עם אותו שם. מתאים לשימוש חד-פעמי ע"י המנהל.</p>
<input id="u" placeholder="שם משתמש מנהל" autocomplete="username"><input id="p" type="password" placeholder="סיסמה" autocomplete="current-password"><input id="f" type="file" accept=".json,application/json"><button id="go">ייבוא</button><div id="m"></div>
<script>
const m=document.getElementById('m');
document.getElementById('go').addEventListener('click',async()=>{
  m.textContent='';
  const f=document.getElementById('f').files[0]; if(!f){m.textContent='בחר קובץ';return;}
  try{
    const data=JSON.parse(await f.text());
    const lr=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:document.getElementById('u').value,p:document.getElementById('p').value})});
    if(!lr.ok){m.textContent='שם משתמש או סיסמה שגויים';return;}
    const {token}=await lr.json();
    const r=await fetch('/api/admin/import',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});
    const j=await r.json(); m.textContent=r.ok?('יובאו '+j.imported+' מסמכים. אפשר לחזור למשחק.'):'הייבוא נכשל';
  }catch(e){m.textContent='הקובץ אינו תקין';}
});
</script></body></html>
