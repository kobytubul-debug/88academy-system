<main style="position: relative; width: min(440px, 100%); box-sizing: border-box; padding: 30px 30px 28px; background: #FFFFFF; border: 6px solid #57AD8E; border-radius: 26px; box-shadow: 0 24px 60px rgba(18, 20, 19, 0.12);">
<h1 style="display: inline-block; margin: 0; padding: 4px 2px 6px; border-top: 5px solid #121413; border-bottom: 5px solid #121413; font-family: 'Karantina', 'Rubik', system-ui, sans-serif; font-size: 52px; line-height: 0.9; font-weight: 700; color: #121413;">כניסה</h1>
<p style="margin: 14px 0 0; font-size: 15px; color: #3D4541;">התחברו עם שם המשתמש והסיסמה שקיבלתם, והמשיכו לצבור מטבעות.</p>
<label for="login-user" style="display: block; margin: 22px 0 8px; font-size: 14px; font-weight: 500; color: #3D4541;">שם משתמש</label>
<input id="login-user" type="text" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{username}}" onChange="{{onUser}}" onKeyDown="{{onEnter}}" aria-invalid="{{invalid}}" aria-describedby="login-error" style="width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px; background: #FFFFFF; border: 1px solid {{fieldBorder}}; border-radius: 10px; color: #1E2320; font: inherit; font-size: 16px; text-align: right;">
<label for="login-pass" style="display: block; margin: 16px 0 8px; font-size: 14px; font-weight: 500; color: #3D4541;">סיסמה</label>
<div style="position: relative;">
<input id="login-pass" type="{{passType}}" dir="ltr" autocomplete="current-password" value="{{password}}" onChange="{{onPass}}" onKeyDown="{{onEnter}}" aria-invalid="{{invalid}}" aria-describedby="login-error" style="width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px 0 50px; background: #FFFFFF; border: 1px solid {{fieldBorder}}; border-radius: 10px; color: #1E2320; font: inherit; font-size: 16px; text-align: right;">
<button type="button" class="eye-btn" aria-label="{{eyeLabel}}" aria-pressed="{{showPass}}" onClick="{{toggleEye}}" style="position: absolute; top: 5px; left: 5px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #545D58; cursor: pointer;"><sc-if value="{{hidePass}}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if><sc-if value="{{showPass}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 3.9M6.4 7.5A16.8 16.8 0 0 0 2.5 12S6 18.5 12 18.5a9.4 9.4 0 0 0 4.2-1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if></button>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<p id="login-error" role="alert" style="display: flex; align-items: center; gap: 8px; margin: 14px 0 0; padding: 10px 12px; background: #FDECEC; border: 1px solid #F2B8B8; border-radius: 10px; font-size: 14px; color: #7F1D1D;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>{{error}}</p>
</sc-if>
<a href="/" ref="{{setGo}}" onClick="{{tryLogin}}" aria-disabled="{{busy}}" class="btn-primary" style="display: flex; align-items: center; justify-content: center; height: 50px; margin-top: 22px; border-radius: 999px; background: #C7436A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">{{buttonLabel}}</a>
<p style="margin: 16px 0 0; font-size: 13px; text-align: center; color: #5E6762;">שכחתם סיסמה? פנו למדריך, והוא יאפס לכם אותה.</p>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {

  defaults() {
    return { username: '', password: '', showPass: false, error: '', busy: false };
  }

  st() {
    return Object.assign(this.defaults(), this.state || {});
  }

  componentDidMount() {
    if (super.componentDidMount) super.componentDidMount();
    // Once another screen has opened (this one is hidden), clear the form so the next visit starts empty.
    try {
      if (typeof IntersectionObserver === 'function' && typeof document !== 'undefined' && document.body) {
        this._seen = new IntersectionObserver((entries) => {
          if (!entries.some((en) => !en.isIntersecting)) return;
          const s = this.st();
          if (!s.busy && (s.username || s.password || s.error || s.showPass)) this.setState(this.defaults());
        });
        this._seen.observe(document.body);
      }
    } catch (err) {
      this._seen = null;
    }
  }

  componentWillUnmount() {
    if (super.componentWillUnmount) super.componentWillUnmount();
    if (this._seen) this._seen.disconnect();
  }



  // Signing in goes through the server: the right password opens the person's own area.
  tryLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    const s = this.st();
    if (s.busy) return;
    if (!s.username.trim() || !s.password) {
      this.setState({ error: 'יש להזין שם משתמש וסיסמה.' });
      return;
    }
    this.setState({ busy: true, error: '' });
    window.Academy.request('POST', '/api/login', { username: s.username.trim(), password: s.password }).then((r) => {
      if (r.ok) {
        location.href = r.json.home || '/';
        return;
      }
      this.setState({ busy: false, error: r.error, password: '' });
    });
  }

  onEnter(e) {
    if (e.key !== 'Enter') return;
    this.tryLogin(e);
  }

  goRef() {
    if (!this._goRef) this._goRef = (el) => { this.goEl = el; };
    return this._goRef;
  }

  renderVals() {
    const s = this.st();
    return {
      username: s.username,
      password: s.password,
      onUser: (e) => this.setState({ username: e.target.value, error: '' }),
      onPass: (e) => this.setState({ password: e.target.value, error: '' }),
      onEnter: (e) => this.onEnter(e),
      passType: s.showPass ? 'text' : 'password',
      showPass: !!s.showPass,
      hidePass: !s.showPass,
      eyeLabel: s.showPass ? 'הסתרת הסיסמה' : 'הצגת הסיסמה',
      toggleEye: () => this.setState({ showPass: !s.showPass }),
      hasError: !!s.error,
      error: s.error,
      invalid: !!s.error,
      fieldBorder: s.error ? '#D64545' : '#D3D9D5',
      tryLogin: (e) => this.tryLogin(e),
      setGo: this.goRef(),
      busy: !!s.busy,
      buttonLabel: s.busy ? 'מתחברים…' : 'כניסה'
    };
  }
}
</script>
