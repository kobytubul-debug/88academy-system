<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מגדל הפיקוח</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* the admin site's look (same as the design-tool pages) */
html, body { margin: 0; }
body { background: #F5F6F4; color: #1E2320; font-family: 'Rubik', system-ui, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; color-scheme: light; }
a { color: #17694F; }
a:hover { color: #0E4F3A; }
.pill-hover:hover { background: #EEF1EF !important; color: #121413 !important; }
.btn-ghost:hover { background: #EEF1EF !important; border-color: #B9C2BD !important; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid #C7436A; outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
/* ================= CONTROL TOWER: the instructor reviews flights the students sent ================= */
.tw-main { max-width: 1320px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 32px) 72px; box-sizing: border-box; }
.tw-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.tw-title h1 { margin: 0; font-family: 'Karantina', 'Rubik', system-ui, sans-serif; font-size: 50px; line-height: 1; font-weight: 700; letter-spacing: .005em; color: #121413; }
.tw-title p { margin: 6px 0 0; font-size: 15px; color: #545D58; }
.tw-filter { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #3D4541; }
.tw-filter select { height: 42px; min-width: 200px; max-width: 100%; padding: 0 12px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; color: #121413; font: inherit; font-size: 15px; }
.tw-msg { margin-top: 18px; padding: 12px 16px; border-radius: 12px; background: #E9FAF3; border: 1px solid #9FDDC4; color: #17694F; font-size: 15px; font-weight: 500; }
.tw-msg.err { background: #FDECEC; border-color: #F2B8B8; color: #7F1D1D; }
.tw-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; margin-top: 22px; align-items: start; }
@media (max-width: 900px) { .tw-grid { grid-template-columns: minmax(0, 1fr); } }
.tw-qh { margin: 0; font-size: 17px; font-weight: 600; color: #121413; }
.tw-qh small { font-size: 14px; font-weight: 500; color: #545D58; }
.tw-qhint { margin: 2px 0 10px; font-size: 13px; color: #6B746F; }
.tw-queue { display: flex; flex-direction: column; gap: 8px; }
.tw-item { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 2px 12px; align-items: center; width: 100%; padding: 12px; border-radius: 14px; border: 1.5px solid #E1E5E2; background: #FFFFFF; color: inherit; font: inherit; text-align: start; cursor: pointer; }
.tw-item:hover { border-color: #9FDDC4; }
.tw-item.on { border-color: #2A9171; box-shadow: 0 0 0 3px #D3F4E6; }
.tw-item b { font-size: 15px; font-weight: 600; min-width: 0; }
.tw-item small { grid-column: 2; font-size: 13px; color: #545D58; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tw-av { grid-row: span 2; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; color: #121413; }
.tw-badge { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 99px; background: #FFF4D6; color: #7A5300; font-size: 11px; font-weight: 600; vertical-align: 1px; white-space: nowrap; }
.tw-badge.chal { background: #EFE7FF; color: #5B3BA8; }
.tw-badge.ai { background: #E8F1FB; color: #1F5C99; }
.tw-empty { display: flex; flex-direction: column; gap: 4px; padding: 22px; border-radius: 14px; border: 1.5px dashed #D3D9D5; background: #FFFFFF; color: #545D58; text-align: center; font-size: 14px; }
.tw-empty b { color: #1E2320; font-size: 15px; }
.tw-review { display: flex; flex-direction: column; gap: 14px; padding: 20px 22px 22px; border-radius: 20px; border: 3px solid #76DEB8; background: #FFFFFF; min-width: 0; }
.tw-who { display: flex; align-items: center; gap: 12px; }
.tw-who .tw-av { grid-row: auto; flex: none; }
.tw-who b { display: block; font-size: 16px; font-weight: 600; }
.tw-who small { display: block; font-size: 13px; color: #545D58; }
.tw-who a { margin-inline-start: auto; font-size: 14px; white-space: nowrap; }
.tw-review h2 { margin: 0; font-family: 'Karantina', 'Rubik', sans-serif; font-size: 44px; line-height: .95; font-weight: 700; color: #121413; }
.tw-review h2 small { display: block; margin-top: 6px; font-family: 'Rubik', sans-serif; font-size: 14px; font-weight: 500; color: #545D58; }
.tw-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.tw-watch, .tw-judge { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 1180px) { .tw-cols { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } .tw-judge { position: sticky; top: 16px; } }
.tw-video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; background: #0B1513; }
.tw-video video, .tw-video iframe { display: block; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.tw-novid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; color: #FFFFFF; text-align: center; font-size: 15px; }
.tw-novid a { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 99px; background: #FFFFFF; color: #121413; font-weight: 600; text-decoration: none; }
.tw-file { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-size: 13px; color: #545D58; }
.tw-file a { font-weight: 500; }
.tw-box { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.tw-box b { font-size: 13px; font-weight: 600; }
.tw-crit { background: #F2FBF7; }
.tw-crit b { color: #17694F; }
.tw-pass { font-weight: 600; color: #17694F; }
.tw-snote { background: #F2F4F3; }
.tw-snote b { color: #3D4541; }
.tw-prev { background: #FFF4E5; }
.tw-prev b { color: #9C5A1E; }
.tw-ai { background: #F7F8F7; border: 1px solid #E1E5E2; }
.tw-ai.pass { background: #F2FBF7; border-color: #BFE6D5; }
.tw-ai.fail { background: #FDF3F3; border-color: #F2B8B8; }
.tw-ai.unclear { background: #FFF8E6; border-color: #EFD48C; }
.tw-ai button { align-self: flex-start; padding: 0; border: 0; background: none; color: #17694F; font: inherit; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.tw-rate { margin: 0; padding: 0; border: 0; min-width: 0; }
.tw-rate legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
.tw-stars { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tw-star { width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid #D3D9D5; background: #FFFFFF; color: #C9D0CC; font-size: 24px; line-height: 1; cursor: pointer; }
.tw-star.on { border-color: #E0A021; background: #FFF8E1; color: #E0A021; }
.tw-ratetxt { margin-inline-start: 8px; font-size: 14px; font-weight: 600; color: #3D4541; }
.tw-coins { margin: -4px 0 0; font-size: 13px; color: #545D58; }
.tw-lbl { margin-bottom: -6px; font-size: 14px; font-weight: 600; }
.tw-review textarea { width: 100%; min-height: 92px; resize: vertical; padding: 10px 12px; border: 1px solid #D3D9D5; border-radius: 10px; background: #FFFFFF; color: #1E2320; font: 15px/1.5 'Rubik', sans-serif; box-sizing: border-box; }
.tw-review textarea:focus { outline: none; border-color: #2A9171; box-shadow: 0 0 0 3px #D3F4E6; }
.tw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tw-chip { padding: 6px 12px; border-radius: 99px; border: 1px solid #D3D9D5; background: #F7F8F7; color: #3D4541; font: 13px 'Rubik', sans-serif; cursor: pointer; }
.tw-chip:hover { border-color: #9FDDC4; background: #EEFAF5; }
.tw-err { margin: 0; font-size: 14px; font-weight: 600; color: #B3261E; }
.tw-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.tw-approve { flex: 1; min-width: 200px; height: 50px; border: 0; border-radius: 12px; background: #C7436A; color: #FFFFFF; font: 600 16px 'Rubik', sans-serif; cursor: pointer; }
.tw-approve:hover { background: #B13A5D; }
.tw-return { height: 50px; padding: 0 20px; border-radius: 12px; border: 1.5px solid #C66A1C; background: #FFFFFF; color: #9C5A1E; font: 600 15px 'Rubik', sans-serif; cursor: pointer; }
.tw-return:hover { background: #FFF4E5; }
.tw-approve:disabled, .tw-return:disabled { opacity: .5; cursor: default; }
.tw-gone { padding: 18px; border-radius: 14px; background: #F7F8F7; color: #3D4541; font-size: 15px; }
.tw-grid.empty { grid-template-columns: minmax(0, 1fr); }
</style>
</head>

<script>
(() => {
  'use strict';
  // 88ACADEMY · the control tower: every flight the students sent, in one queue, reviewed with stars and a note.
  const $ = (s, r = document) => r.querySelector(s);
  const A = window.Academy;
  if (!A || !A.on || !A.me || A.me.role !== 'admin') { location.replace('/'); return; }
  $('#meI').textContent = (A.me.name || '?').trim().charAt(0);
  $('#meN').textContent = A.me.name || '';

  const esc = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const COLORS = ['#76DEB8', '#5BC8FF', '#FFD15C', '#FF9A3C', '#B99CFF', '#FF8FB0', '#9DBDB3', '#F0D46A'];
  const colorOf = (id) => { let h = 0; String(id).split('').forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return COLORS[h % COLORS.length]; };
  const RATE = { 1: 'עבר, צריך עוד תרגול', 2: 'טוב', 3: 'מצוין' };
  const QUICK = ['הרחפן עבר את הנקודה בדיוק', 'הגובה לא נשמר קבוע', 'הסרטון לא מראה את כל התרגיל', 'שליטה יפה, ככה ממשיכים'];
  const VERDICT = { pass: 'עוברת', fail: 'לא עוברת', unclear: 'לא ברור' };
  const firstName = (n) => String(n || '').trim().split(/\s+/)[0] || 'התלמיד';
  const when = (at) => { const a = A.ago(at); return a === 'היום' && String(at || '').length > 10 ? 'היום ' + String(at).slice(11, 16) : a; };
  const safeHref = (u) => /^https?:\/\//i.test(String(u || '')) || A.isFile(u) ? String(u) : '';

  // ---------- the data the server put on the page (refreshed every half minute) ----------
  const units = () => A.data.units || [];
  const unitName = (id) => { const u = units().find(x => x.id === id); return u ? u.name : ''; };
  const withKids = (id) => { const out = [id]; for (let i = 0; i < out.length && i < 300; i++) units().forEach(u => { if (u.parent === out[i] && out.indexOf(u.id) === -1) out.push(u.id); }); return out; };
  const treeOrder = () => {
    const out = [], seen = new Set();
    const add = (u, depth) => { if (seen.has(u.id) || depth > 6) return; seen.add(u.id); out.push({ u, depth }); units().filter(x => x.parent === u.id).forEach(x => add(x, depth + 1)); };
    units().filter(u => !u.parent || !units().some(x => x.id === u.parent)).forEach(u => add(u, 0));
    units().forEach(u => add(u, 0));
    return out;
  };
  const curr = () => A.data.curriculum || {};
  const skillOf = (id) => (A.data.skills || []).find(k => k.id === Number(id)) || (curr().skills || []).find(k => k.id === Number(id)) || null;
  const chalOf = (id) => (A.data.challenges || []).find(c => c.id === id) || (curr().challenges || []).find(c => c.id === id) || null;
  const levelName = (n) => ((A.data.levels || []).find(l => l.n === n) || {}).name || '';
  const sameTarget = (f, x) => f.challenge ? x.challenge === f.challenge : (!x.challenge && x.skill === f.skill);
  const targetName = (f) => { if (f.challenge) { const c = chalOf(f.challenge); return c ? c.title : A.challengeTitle(f.challenge); } const k = skillOf(f.skill); return k ? k.name : (A.skillName(f.skill) || 'מיומנות'); };
  const rule = (k) => { const r = A.data.scoring && A.data.scoring.rules && A.data.scoring.rules[k]; return r && r.on ? Number(r.points) || 0 : 0; };

  // every flight waiting for a review, the one waiting longest first
  const allItems = () => {
    const out = [];
    A.users('student').forEach(u => {
      const d = A.progress(u.id);
      (d.flights || []).forEach(f => { if (f.status === 'review') out.push({ key: u.id + ':' + f.id, u, f, d }); });
    });
    return out.sort((a, b) => String(a.f.at || '').localeCompare(String(b.f.at || '')));
  };
  const S = { unit: 'all', sel: null, rate: {}, note: {}, msg: '', msgErr: false, busy: false };
  try { S.unit = sessionStorage.getItem('g88-tower-unit') || 'all'; } catch (e) {}
  const inFilter = (it, unit) => unit === 'all' ? true : unit === 'none' ? !it.u.unit || !unitName(it.u.unit) : withKids(unit).indexOf(it.u.unit) !== -1;
  const shown = () => allItems().filter(it => inFilter(it, S.unit));

  // coins the student gets when the flight is approved (the stars don't change them)
  const coinsFor = (it) => {
    const { u, f, d } = it;
    if (!u.earns) return null;
    if (f.challenge) {
      const c = chalOf(f.challenge);
      return d.ledger.some(e => e.kind === 'challenge' && e.challenge === f.challenge && !e.reverted) ? 0 : Number(c && c.points) || 0;
    }
    if (d.ledger.some(e => e.skill === f.skill && e.kind === 'skill' && !e.reverted)) return 0;
    const first = !d.flights.some(x => x.id !== f.id && sameTarget(f, x) && x.status === 'rejected');
    let n = A.skillPoints(f.skill) + (first ? rule('first') : 0);
    const k = skillOf(f.skill), lb = (A.data.scoring && A.data.scoring.levelBonus) || {};
    if (k && lb.on && Number(lb[k.level]) > 0 && !d.ledger.some(e => e.kind === 'level' && e.level === k.level && !e.reverted)) {
      const rest = A.summary(u.id).skillsList.filter(x => x.level === k.level && x.id !== k.id);
      if (rest.every(x => d.acquired[x.id])) n += Number(lb[k.level]);
    }
    return n;
  };

  // ---------- the group filter ----------
  const renderFilter = () => {
    const list = allItems(), sel = $('#twUnit');
    const count = (id) => list.filter(it => inFilter(it, id)).length;
    if (S.unit !== 'all' && S.unit !== 'none' && !unitName(S.unit)) S.unit = 'all';
    const none = count('none');
    sel.innerHTML = `<option value="all">כל הקבוצות (${list.length})</option>` + treeOrder().map(({ u, depth }) => `<option value="${esc(u.id)}">${'— '.repeat(depth)}${esc(u.name)} (${count(u.id)})</option>`).join('') + (none ? `<option value="none">בלי קבוצה (${none})</option>` : '');
    sel.value = S.unit;
    if (sel.value !== S.unit) { S.unit = 'all'; sel.value = 'all'; }
  };
  $('#twUnit').onchange = (e) => {
    S.unit = e.target.value; try { sessionStorage.setItem('g88-tower-unit', S.unit); } catch (x) {}
    S.msg = ''; const q = shown(); S.sel = q[0] ? q[0].key : null;
    render();
  };

  // ---------- the queue ----------
  const itemRow = (it) => {
    const { u, f, d } = it, on = it.key === S.sel;
    const retry = d.flights.some(x => x.id !== f.id && sameTarget(f, x) && x.status === 'rejected');
    const c = f.challenge ? chalOf(f.challenge) : null;
    const ai = f.ai && (f.ai.status === 'queued' || f.ai.status === 'checking');
    const badges = (c ? `<span class="tw-badge chal">${c.final ? 'מבחן מסכם' : 'אתגר'}</span>` : '') + (retry ? '<span class="tw-badge">טיסה חוזרת</span>' : '') + (ai ? '<span class="tw-badge ai">בבדיקת AI</span>' : '');
    const g = unitName(u.unit);
    return `<button class="tw-item ${on ? 'on' : ''}" type="button" data-k="${esc(it.key)}" aria-pressed="${on}"><span class="tw-av" style="background:${colorOf(u.id)}" aria-hidden="true">${esc((u.name || '?').trim().charAt(0))}</span><b>${esc(u.name)}${badges}</b><small>${esc(targetName(f))} · ${esc(when(f.at))}${g && S.unit === 'all' ? ' · ' + esc(g) : ''}</small></button>`;
  };
  const renderQueue = () => {
    const q = shown(), box = $('#twQueue');
    $('#twQCount').textContent = q.length ? `· ${q.length}` : '';
    const total = allItems().length;
    $('#twSub').innerHTML = total ? `${total === 1 ? 'טיסה אחת מחכה' : `<b>${total}</b> טיסות מחכות`} לבדיקה שלך. מאשרים עם כוכבים והערה, או מחזירים לתיקון.` : 'אין טיסות שמחכות לבדיקה.';
    $('.tw-grid').classList.toggle('empty', !q.length);
    if (!q.length) {
      box.innerHTML = `<div class="tw-empty"><b>אין טיסות שמחכות${S.unit !== 'all' ? ' בקבוצה הזו' : ''}</b><span>כשתלמיד שולח טיסה מהמסך שלו, היא מופיעה כאן. הדף מתעדכן לבד כל חצי דקה.</span></div>`;
      return;
    }
    box.innerHTML = q.map(itemRow).join('');
    box.querySelectorAll('[data-k]').forEach(b => b.onclick = () => select(b.dataset.k, true));
  };
  const select = (key, scroll) => {
    S.sel = key; S.msg = '';
    renderQueue(); renderReview(); renderMsg();
    const r = $('#twReview');
    if (scroll && innerWidth <= 900 && !r.hidden) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  // ---------- reviewing one flight ----------
  const videoHTML = (f) => {
    const link = String(f.link || '');
    if (!link) return '<div class="tw-novid"><span>לטיסה הזו לא צורף סרטון.</span></div>';
    if (A.isFile(link)) return `<video controls playsinline preload="metadata" src="${esc(link)}"></video>`;
    const emb = A.embedUrl(link);
    if (emb) return `<iframe src="${esc(emb)}" title="סרטון הטיסה" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    const h = safeHref(link);
    return `<div class="tw-novid"><span>הסרטון בקישור שלא מתנגן בתוך הדף.</span>${h ? `<a href="${esc(h)}" target="_blank" rel="noopener">פתיחת הסרטון בלשונית חדשה ↗</a>` : ''}</div>`;
  };
  const aiHTML = (f) => {
    const ai = f.ai;
    if (!ai || ai.status === 'skipped') return '';
    if (ai.status === 'queued' || ai.status === 'checking') return `<div class="tw-box tw-ai"><b>🤖 ${ai.status === 'checking' ? 'בבדיקת AI עכשיו…' : 'ממתינה לבדיקת AI…'}</b><span>התוצאה תופיע כאן. אפשר לבדוק בעצמך כבר עכשיו.</span></div>`;
    if (ai.status === 'error') return `<div class="tw-box tw-ai fail"><b>🤖 בדיקת ה־AI נכשלה</b>${ai.error ? `<span>${esc(ai.error)}</span>` : ''}</div>`;
    if (ai.status !== 'done') return '';
    const cls = ['pass', 'fail', 'unclear'].indexOf(ai.verdict) !== -1 ? ai.verdict : '';
    return `<div class="tw-box tw-ai ${cls}"><b>🤖 בדיקת AI: ${esc(VERDICT[ai.verdict] || ai.verdict || '')}${ai.confidence != null ? ' · ביטחון ' + esc(ai.confidence) + '%' : ''}</b>${ai.feedback ? `<span>משוב לתלמיד: ${esc(ai.feedback)}</span>` : ''}${ai.notes ? `<span style="color:#545D58">למדריך: ${esc(ai.notes)}</span>` : ''}${ai.feedback ? '<button type="button" data-a="useai">להעתיק את המשוב לתיבה</button>' : ''}</div>`;
  };
  const critHTML = (f) => {
    if (f.challenge) { const c = chalOf(f.challenge); return c && c.desc ? `<div class="tw-box tw-crit"><b>מה האתגר</b><span>${esc(c.desc)}</span></div>` : ''; }
    const k = skillOf(f.skill); if (!k) return '';
    const parts = [k.desc ? `<span>${esc(k.desc)}</span>` : '', k.pass ? `<span class="tw-pass">✓ ${esc(k.pass)}</span>` : '', k.map ? `<span>מפה: ${esc(k.map)}</span>` : ''].join('');
    return parts ? `<div class="tw-box tw-crit"><b>מה בודקים</b>${parts}</div>` : '';
  };
  const rateLine = (it, r) => {
    const c = coinsFor(it);
    return c == null ? `${firstName(it.u.name)} במצב סטודנט, בלי נקודות: האישור, הכוכבים וההערה יגיעו בלי מטבעות.` : c > 0 ? `באישור: +${c} מטבעות ל${firstName(it.u.name)}. הכוכבים לא משנים את מספר המטבעות.` : `המטבעות על ${it.f.challenge ? 'האתגר' : 'התרגיל'} הזה כבר ניתנו.`;
  };
  const renderReview = () => {
    const pane = $('#twReview'), q = shown(), it = q.find(x => x.key === S.sel) || null;
    if (!it) {
      if (S.sel && !q.length) { pane.hidden = true; return; }
      if (S.sel) { pane.hidden = false; pane.innerHTML = `<div class="tw-gone">הטיסה הזו כבר נבדקה, אולי בדף אחר או בבדיקה האוטומטית. ${q.length ? 'בחרו טיסה אחרת מהתור.' : ''}</div>`; return; }
      if (q[0]) { S.sel = q[0].key; return renderReview(); }
      pane.hidden = true; return;
    }
    const { u, f, d } = it, key = it.key;
    const retry = d.flights.some(x => x.id !== f.id && sameTarget(f, x) && x.status === 'rejected');
    const redo = !f.challenge && d.redo && d.redo[f.skill];
    const prev = d.flights.find(x => x.id !== f.id && sameTarget(f, x) && x.status === 'rejected' && x.feedback);
    const c = f.challenge ? chalOf(f.challenge) : null, k = f.challenge ? null : skillOf(f.skill);
    const sub = c ? (c.final ? 'המבחן המסכם של המסלול' : 'אתגר מהמדריך') + (c.level ? ' · ' + levelName(c.level) : '') : k ? levelName(k.level) : '';
    const r = S.rate[key] || 3, note = S.note[key] != null ? S.note[key] : '';
    const h = safeHref(f.link);
    pane.hidden = false;
    pane.innerHTML = `<div class="tw-who"><span class="tw-av" style="background:${colorOf(u.id)}" aria-hidden="true">${esc((u.name || '?').trim().charAt(0))}</span><div><b>${esc(u.name)}</b><small>${redo ? 'ביצוע חוזר שביקשת' : retry ? 'טיסה חוזרת אחרי תיקון' : 'טיסה ראשונה ב' + (c ? 'אתגר הזה' : 'תרגיל הזה')} · נשלחה ${esc(when(f.at))}${unitName(u.unit) ? ' · ' + esc(unitName(u.unit)) : ''}${u.earns ? '' : ' · לא צובר נקודות'}</small></div><a href="StudentDetail.dc.html?id=${encodeURIComponent(u.id)}">לכרטיס התלמיד</a></div>
      <h2>${esc(targetName(f))}${sub ? `<small>${esc(sub)}</small>` : ''}</h2>
      <div class="tw-cols"><div class="tw-watch">
        <div class="tw-video" id="twVideo">${videoHTML(f)}</div>
        ${h ? `<div class="tw-file"><span>${A.isFile(f.link) ? 'הסרטון הועלה לאתר' : 'קישור לסרטון'}</span><a href="${esc(h)}" target="_blank" rel="noopener">פתיחה בלשונית חדשה ↗</a></div>` : ''}
        ${f.note ? `<div class="tw-box tw-snote"><b>הערת התלמיד</b><span>“${esc(f.note)}”</span></div>` : ''}
        ${critHTML(f)}
        ${prev ? `<div class="tw-box tw-prev"><b>ההערה הקודמת ${prev.reviewer ? 'של ' + esc(prev.reviewer) : 'שלך'}</b><span>“${esc(prev.feedback)}”</span></div>` : ''}
        <div id="twAi">${aiHTML(f)}</div>
      </div><div class="tw-judge">
        <fieldset class="tw-rate"><legend>דירוג הטיסה</legend><div class="tw-stars">${[1, 2, 3].map(n => `<button type="button" class="tw-star ${n <= r ? 'on' : ''}" data-star="${n}" aria-pressed="${n === r}" aria-label="${n === 1 ? 'כוכב אחד' : n + ' כוכבים'}">★</button>`).join('')}<span class="tw-ratetxt" id="twRateTxt">${RATE[r]}</span></div></fieldset>
        <p class="tw-coins">${esc(rateLine(it, r))}</p>
        <label class="tw-lbl" for="twNote">הערה לתלמיד</label>
        <textarea id="twNote" rows="3" maxlength="500" placeholder="מה היה טוב, ומה לשפר בפעם הבאה. חובה כשמחזירים לתיקון.">${esc(note)}</textarea>
        <div class="tw-chips">${QUICK.map(x => `<button type="button" class="tw-chip" data-note="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <p class="tw-err" id="twErr" role="alert" hidden></p>
        <div class="tw-actions"><button type="button" class="tw-approve" id="twOk">אישור הטיסה · <span id="twOkStars">${'★'.repeat(r) + '☆'.repeat(3 - r)}</span></button><button type="button" class="tw-return" id="twFix">החזרה לתיקון</button></div>
      </div></div>`;
    wire(it);
  };
  const wire = (it) => {
    const pane = $('#twReview'), key = it.key;
    const vid = pane.querySelector('#twVideo video');
    if (vid) vid.addEventListener('error', () => { $('#twVideo').innerHTML = '<div class="tw-novid"><span>הסרטון לא נטען. ייתכן שהקובץ כבר נמחק מהשרת.</span></div>'; });
    pane.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
      const r = +b.dataset.star; S.rate[key] = r;
      pane.querySelectorAll('[data-star]').forEach(x => { const n = +x.dataset.star; x.classList.toggle('on', n <= r); x.setAttribute('aria-pressed', String(n === r)); });
      $('#twRateTxt').textContent = RATE[r]; $('#twOkStars').textContent = '★'.repeat(r) + '☆'.repeat(3 - r);
    });
    const note = $('#twNote'), err = $('#twErr');
    note.oninput = () => { S.note[key] = note.value; err.hidden = true; };
    pane.querySelectorAll('[data-note]').forEach(b => b.onclick = () => {
      const v = note.value.trim(); note.value = (v ? v.replace(/[.!]?$/, '. ') : '') + b.dataset.note; S.note[key] = note.value; err.hidden = true; note.focus();
    });
    $('#twOk').onclick = () => review(it, true);
    $('#twFix').onclick = () => review(it, false);
  };
  const review = (it, approve) => {
    if (S.busy) return;
    const note = String(S.note[it.key] || '').trim(), r = S.rate[it.key] || 3, err = $('#twErr');
    if (!approve && !note) { err.textContent = 'כדי להחזיר לתיקון, כתבו לתלמיד מה לתקן.'; err.hidden = false; $('#twNote').focus(); return; }
    S.busy = true; $('#twOk').disabled = true; $('#twFix').disabled = true;
    const q = shown(), at = q.findIndex(x => x.key === it.key);
    A.call('reviewFlight', { id: it.u.id, flight: it.f.id, approve, feedback: note, stars: approve ? r : undefined }).then(res => {
      S.busy = false;
      if (!res.ok) { err.textContent = res.error || 'הבדיקה לא נשמרה. נסו שוב.'; err.hidden = false; $('#twOk').disabled = false; $('#twFix').disabled = false; return; }
      const nm = firstName(it.u.name);
      S.msg = approve ? `✓ הטיסה של ${nm} ב${targetName(it.f)} אושרה · ${'★'.repeat(r) + '☆'.repeat(3 - r)}. ההודעה${note ? ' וההערה שלך' : ''} כבר מחכות במסך של ${nm}.` : `הטיסה של ${nm} ב${targetName(it.f)} הוחזרה לתיקון. ההערה שלך מחכה במסך של ${nm}, ומשם שולחים טיסה חוזרת.`;
      S.msgErr = false;
      delete S.note[it.key]; delete S.rate[it.key];
      const left = shown(); const next = left[Math.min(at, left.length - 1)] || null;
      S.sel = next ? next.key : null;
      render();
      const b = next && $(`#twQueue [data-k="${CSS.escape(next.key)}"]`);
      (b || $('#twMsg')).focus && (b || $('#twMsg')).focus({ preventScroll: true });
      if (innerWidth <= 900) scrollTo({ top: 0, behavior: 'smooth' });
    });
  };
  // the automatic check's feedback can be copied into the note (its box is redrawn when the check finishes)
  $('#twReview').addEventListener('click', (e) => {
    if (!e.target.closest('[data-a="useai"]')) return;
    const it = shown().find(x => x.key === S.sel), note = $('#twNote');
    if (!it || !note || !it.f.ai || !it.f.ai.feedback) return;
    note.value = it.f.ai.feedback; S.note[it.key] = note.value; $('#twErr').hidden = true; note.focus();
  });
  const renderMsg = () => { const m = $('#twMsg'); m.hidden = !S.msg; m.textContent = S.msg; m.classList.toggle('err', S.msgErr); if (S.msg) m.tabIndex = -1; };
  const render = () => { renderFilter(); renderQueue(); renderReview(); renderMsg(); };

  // fresh data every half minute (and after every review): keep what was typed, update the queue around it
  A.listen(() => {
    renderFilter(); renderQueue();
    const it = shown().find(x => x.key === S.sel);
    if (!it || !$('#twNote')) renderReview();
    else { const box = $('#twAi'); if (box) { const html = aiHTML(it.f); if (box.innerHTML !== html) box.innerHTML = html; } }
  });

  // a link from elsewhere can open one flight: Tower.html#<student>:<flight>
  const fromHash = decodeURIComponent((location.hash || '').slice(1));
  if (fromHash && allItems().some(x => x.key === fromHash)) { S.unit = 'all'; S.sel = fromHash; }
  else { const q = shown(); S.sel = q[0] ? q[0].key : null; }
  render();
})();
</script>
</body>
</html>
