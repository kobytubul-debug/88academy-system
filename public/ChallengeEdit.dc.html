</div>
<div style="flex: 1 1 140px; min-width: 0;">
<label for="ch-time" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #3D4541;">בשעה</label>
<input id="ch-time" type="time" value="{{endTime}}" onInput="{{onTime}}" onChange="{{onTime}}" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #D3D9D5; border-radius: 10px; color: #1E2320; font: inherit; font-size: 15px;">
</div>
</div>
<div>
<label for="ch-video" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #3D4541;">סרטון הדגמה <span style="font-weight: 400; color: #5E6762;">(לא חובה, YouTube או Google Drive)</span></label>
<input id="ch-video" type="url" dir="ltr" value="{{video}}" onInput="{{onVideo}}" placeholder="https://youtu.be/…" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #D3D9D5; border-radius: 10px; color: #1E2320; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; text-align: left;">
</div>
<label style="display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font-size: 15px; font-weight: 500; color: #1E2320; cursor: pointer;"><input type="checkbox" checked="{{active}}" onChange="{{toggleActive}}" style="width: 18px; height: 18px; margin: 0; accent-color: #B23A5E; cursor: pointer;">פעיל <span style="font-weight: 400; color: #5E6762;">(גלוי לסטודנטים)</span></label>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 16px 0 0; font-size: 14px; color: #B42318;">{{error}}</p></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 28px;">
<button type="button" class="btn-primary" onClick="{{save}}" disabled="{{busy}}" style="height: 46px; padding: 0 28px; border: 0; border-radius: 10px; background: #C7436A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">{{saveLabel}}</button>
<a href="Curriculum.dc.html" class="btn-ghost" style="display: inline-flex; align-items: center; height: 46px; padding: 0 20px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D3D9D5; background: #FFFFFF; color: #3D4541; text-decoration: none; font-size: 15px;">ביטול</a>
<sc-if value="{{canDelete}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{askDelete}}" style="margin-inline-start: auto; height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid #F2B8B8; background: #FDECEC; color: #B42318; font: inherit; font-size: 15px; cursor: pointer;">מחיקת האתגר</button></sc-if>
</div>
<sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 14px; padding: 14px 16px; background: #FDECEC; border: 1px solid #F2B8B8; border-radius: 12px;">
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #7F1D1D;">{{confirmText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;">
<button type="button" onClick="{{doDelete}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 9px; background: #C62828; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">מחיקה סופית</button>
<button type="button" onClick="{{cancelDelete}}" style="height: 38px; padding: 0 16px; border-radius: 9px; border: 1px solid #D3D9D5; background: #FFFFFF; color: #3D4541; font: inherit; font-size: 14px; cursor: pointer;">ביטול</button>
</div>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1990}}'>
class Component extends DCLogic {
  // A challenge: an extra task that pays coins once the instructor approves the student's flight.
  A() {
    return window.Academy && window.Academy.on ? window.Academy : null;
  }

  param(name) {
    try { return new URLSearchParams(location.search).get(name) || ''; } catch (e) { return ''; }
  }

  cur() {
    const A = this.A();
    return A && A.data.curriculum ? A.data.curriculum : { levels: [{ n: 1, name: 'אבני יסוד' }], skills: [], challenges: [] };
  }

  original() {
    const id = this.param('id');
    return id ? this.cur().challenges.find((c) => c.id === id) || null : null;
  }

  st() {
    if (this.state && this.state.ready) return this.state;
    const c = this.original();
    const cur = this.cur();
    return {
      ready: true, id: c ? c.id : '', title: c ? c.title : '', desc: c ? c.desc || '' : '', level: String(c ? c.level : cur.levels[0].n),
      points: String(c ? c.points : 50), endDate: c && c.ends ? c.ends.slice(0, 10) : '', endTime: c && c.ends && c.ends.length > 10 ? c.ends.slice(11, 16) : '',
      video: c ? c.video || '' : '', active: c ? c.active !== false : true, error: '', busy: false, confirming: false
    };
  }

  set(patch) {
    this.setState(Object.assign({}, this.st(), patch, { error: '' }));
  }

  save() {
    const s = this.st();
    const A = this.A();
    const title = s.title.trim();
    const pts = Number(String(s.points).trim());
    const video = s.video.trim();
    let error = '';
    if (!title) error = 'כתבו כותרת לאתגר.';
    else if (!Number.isInteger(pts) || pts < 0 || pts > 100000) error = 'הנקודות צריכות להיות מספר שלם, 0 ומעלה.';
    else if (s.endTime && !s.endDate) error = 'בחרו תאריך סיום, או מחקו את השעה.';
    else if (video && !/^https?:\/\/\S+$/i.test(video)) error = 'הקישור לסרטון צריך להתחיל ב־https://';
    if (error) { this.setState(Object.assign({}, s, { error: error })); return; }
    if (!A) return;
    const cur = JSON.parse(JSON.stringify(this.cur()));
    let c = s.id ? cur.challenges.find((x) => x.id === s.id) : null;
    if (!c) { c = { id: 'c' + Date.now().toString(36) }; cur.challenges.push(c); }
    Object.assign(c, { title: title, desc: s.desc.trim(), level: Number(s.level), points: pts, ends: s.endDate ? s.endDate + (s.endTime ? ' ' + s.endTime : '') : '', video: video, active: !!s.active });
    this.setState(Object.assign({}, s, { busy: true }));
    A.call('saveCurriculum', { curriculum: cur, note: (s.id ? 'עדכן את האתגר ' : 'הוסיף את האתגר ') + title }).then((r) => {
      if (!r.ok) { this.setState(Object.assign({}, this.st(), { busy: false, error: r.error })); return; }
      location.href = 'Curriculum.dc.html';
    });
  }

  doDelete() {
    const s = this.st();
    const A = this.A();
    if (!A || !s.id) return;
    const cur = JSON.parse(JSON.stringify(this.cur()));
    cur.challenges = cur.challenges.filter((x) => x.id !== s.id);
    this.setState(Object.assign({}, s, { busy: true }));
    A.call('saveCurriculum', { curriculum: cur, note: 'מחק את האתגר ' + s.title }).then((r) => {
      if (!r.ok) { this.setState(Object.assign({}, this.st(), { busy: false, error: r.error })); return; }
      location.href = 'Curriculum.dc.html';
    });
  }

  renderVals() {
    const s = this.st();
    const A = this.A();
    const meName = A ? A.me.name : 'יהודה';
    return {
      meName: meName,
      meInitial: String(meName || '?').trim().charAt(0),
      heading: s.id ? 'עריכת אתגר' : 'אתגר חדש',
      missing: !!this.param('id') && !s.id,
      levelOptions: this.cur().levels.map((l) => ({ value: String(l.n), label: 'רמה ' + l.n + ' · ' + l.name })),
      title: s.title, desc: s.desc, level: s.level, points: s.points, endDate: s.endDate, endTime: s.endTime, video: s.video, active: !!s.active,
      onTitle: (e) => this.set({ title: e.target.value }),
      onDesc: (e) => this.set({ desc: e.target.value }),
      onLevel: (e) => this.set({ level: e.target.value }),
      onPoints: (e) => this.set({ points: e.target.value.slice(0, 7) }),
      onDate: (e) => this.set({ endDate: e.target.value }),
      onTime: (e) => this.set({ endTime: e.target.value }),
      onVideo: (e) => this.set({ video: e.target.value }),
      toggleActive: () => this.set({ active: !s.active }),
      hasError: !!s.error, error: s.error,
      busy: !!s.busy, saveLabel: s.busy ? 'שומר…' : 'שמירה', save: () => this.save(),
      canDelete: !!s.id,
      askDelete: () => this.set({ confirming: true }),
      cancelDelete: () => this.set({ confirming: false }),
      confirming: !!s.confirming,
      confirmText: 'למחוק את האתגר ' + s.title + '? סטודנטים שכבר קיבלו עליו מטבעות שומרים אותם.',
      doDelete: () => this.doDelete()
    };
  }
}
</script>
</body>
</html>
